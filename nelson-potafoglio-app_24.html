.zt-topbar-shield{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
  background:rgba(26,158,92,.08);border:1px solid rgba(26,158,92,.2);
  font-size:11.5px;font-weight:700;color:#1a9e5c;cursor:pointer;transition:.2s;}
.zt-topbar-shield:hover{background:rgba(26,158,92,.15);}

/* MFA Screen */
.mfa-stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:linear-gradient(160deg,#ebe8ff,#f8f6ff 50%,#fff8ee);}
.mfa-card{background:#fff;border-radius:22px;padding:42px 40px;width:420px;
  box-shadow:0 24px 64px rgba(124,92,191,.18);border:1px solid rgba(124,92,191,.1);}
.mfa-icon-wrap{width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--purple-l));
  display:flex;align-items:center;justify-content:center;font-size:32px;
  margin:0 auto 20px;box-shadow:0 8px 24px rgba(124,92,191,.3);}
.mfa-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;color:var(--text);}
.mfa-sub{font-size:13px;color:var(--tm);text-align:center;margin-bottom:28px;line-height:1.65;}
.otp-row{display:flex;gap:10px;justify-content:center;margin-bottom:22px;}
.otp-box{width:50px;height:58px;border-radius:12px;border:2px solid var(--border);
  text-align:center;font-size:24px;font-weight:800;background:var(--s2);
  color:var(--text);transition:.2s;font-family:'DM Sans',sans-serif;}
.otp-box:focus{border-color:var(--purple);background:#fff;outline:none;
  box-shadow:0 0 0 3px rgba(124,92,191,.12);}
.otp-box.filled{border-color:var(--purple);background:rgba(124,92,191,.05);}
.otp-box.wrong{border-color:var(--red);animation:shake .35s ease;}
.otp-box.right{border-color:#1a9e5c;background:rgba(26,158,92,.05);}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}}
.mfa-hint{background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.2);
  border-radius:10px;padding:10px 14px;font-size:12px;color:#b8900f;
  display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.mfa-timer{font-size:12px;color:var(--tm);text-align:center;margin-bottom:14px;}
.mfa-resend{background:none;border:none;color:var(--purple);cursor:pointer;
  font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;}
.mfa-resend:disabled{color:var(--td);cursor:default;}
.mfa-attempts{display:flex;justify-content:center;gap:6px;margin-top:8px;}
.mfa-attempt-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:.3s;}
.mfa-attempt-dot.used{background:var(--red);}

/* ══ ZERO TRUST ARCHITECTURE STYLES ══ */
/* Trust badge in topbar */
.zt-badge{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;
font-size:11px;font-weight:700;cursor:pointer;transition:.2s;border:1px solid transparent;white-space:nowrap;}
.zt-badge.trusted{background:rgba(26,158,92,.1);border-color:rgba(26,158,92,.25);color:#1a9e5c;}
.zt-badge.warning{background:rgba(243,156,18,.1);border-color:rgba(243,156,18,.25);color:#f39c12;}
.zt-badge.danger{background:rgba(214,48,49,.1);border-color:rgba(214,48,49,.25);color:var(--red);}

/* Security Center */
.sc-wrap{max-width:680px;}
.sc-score-card{background:linear-gradient(135deg,#1a0a3a,#2a1560,#1a2a3a);
border-radius:20px;padding:28px 32px;margin-bottom:22px;color:#fff;
display:flex;align-items:center;gap:28px;position:relative;overflow:hidden;}
.sc-score-card::before{content:'';position:absolute;inset:0;
background:radial-gradient(ellipse at 80% 20%,rgba(155,125,224,.2),transparent 60%);}
.sc-score-ring{position:relative;flex-shrink:0;}
.sc-score-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
text-align:center;}
.sc-score-val{font-size:32px;font-weight:900;line-height:1;}
.sc-score-lbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px;}
.sc-score-info{flex:1;position:relative;z-index:1;}
.sc-score-title{font-size:22px;font-weight:800;margin-bottom:4px;}
.sc-score-sub{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:14px;line-height:1.5;}
.sc-pillars{display:flex;gap:8px;flex-wrap:wrap;}
.sc-pillar{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;
background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);}
.sc-pillar.active{background:rgba(26,158,92,.25);color:#6ee7b7;}

/* Status grid */
.sc-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.sc-status-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;}
.sc-status-icon{font-size:26px;margin-bottom:8px;}
.sc-status-title{font-size:12px;font-weight:700;margin-bottom:3px;}
.sc-status-val{font-size:11px;font-weight:700;}
.sc-status-val.ok{color:var(--green);}
.sc-status-val.warn{color:#f39c12;}
.sc-status-val.bad{color:var(--red);}
.sc-status-bar{height:4px;border-radius:2px;background:var(--s3);margin-top:8px;overflow:hidden;}
.sc-status-fill{height:100%;border-radius:2px;transition:.6s;}

/* Sessions */
.sc-session-item{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;}
.sc-session-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.sc-session-info{flex:1;}
.sc-session-name{font-size:13px;font-weight:600;}
.sc-session-meta{font-size:11px;color:var(--tm);}
.sc-session-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
.sc-session-status.current{background:rgba(26,158,92,.1);color:var(--green);}
.sc-session-status.other{background:rgba(243,156,18,.1);color:#f39c12;}
.sc-session-revoke{padding:5px 12px;border-radius:8px;background:rgba(214,48,49,.07);
border:1px solid rgba(214,48,49,.2);color:var(--red);font-size:11px;font-weight:600;
cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;}
.sc-session-revoke:hover{background:rgba(214,48,49,.14);}

/* Activity log */
.sc-log-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;
border-bottom:1px solid rgba(0,0,0,.05);}
.sc-log-item:last-child{border-bottom:none;}
.sc-log-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;}
.sc-log-title{font-size:12.5px;font-weight:600;}
.sc-log-meta{font-size:11px;color:var(--tm);}
.sc-log-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;
margin-left:6px;}
.sc-log-badge.ok{background:rgba(26,158,92,.1);color:var(--green);}
.sc-log-badge.warn{background:rgba(243,156,18,.1);color:#f39c12;}
.sc-log-badge.block{background:rgba(214,48,49,.1);color:var(--red);}

/* Trusted devices */
.sc-device-item{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;}
.sc-device-icon{font-size:24px;width:36px;text-align:center;}
.sc-device-name{font-size:13px;font-weight:600;}
.sc-device-meta{font-size:11px;color:var(--tm);}
.sc-device-current{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;
background:rgba(26,158,92,.1);color:var(--green);}
.sc-trust-badge{display:flex;align-items:center;gap:4px;font-size:10.5px;
font-weight:700;padding:3px 9px;border-radius:10px;}
.sc-trust-badge.full{background:rgba(26,158,92,.1);color:var(--green);}
.sc-trust-badge.partial{background:rgba(243,156,18,.1);color:#f39c12;}

/* Recommendations */
.sc-rec-item{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.2s;}
.sc-rec-item:hover{border-color:var(--purple);}
.sc-rec-done{opacity:.5;}

/* Transaction Guard */
.tg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8000;
display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.tg-card{background:#fff;border-radius:22px;padding:36px 32px;width:380px;
box-shadow:0 24px 80px rgba(0,0,0,.25);text-align:center;}
.tg-icon{font-size:52px;margin-bottom:14px;animation:bounceIn .4s ease;}
.tg-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px;}
.tg-sub{font-size:13px;color:var(--tm);margin-bottom:24px;line-height:1.6;}
.tg-amount-box{background:linear-gradient(135deg,var(--purple),var(--purple-l));
border-radius:14px;padding:16px 20px;margin-bottom:22px;color:#fff;}
.tg-amount-val{font-size:28px;font-weight:800;}
.tg-amount-lbl{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px;}
.pin-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
.pin-box{width:52px;height:60px;border-radius:12px;border:2px solid var(--border);
background:var(--s2);font-size:24px;font-weight:800;text-align:center;
color:var(--text);font-family:'DM Sans',sans-serif;transition:.2s;}
.pin-box:focus{border-color:var(--purple);background:#fff;outline:none;}
.pin-box.filled{border-color:var(--purple);background:rgba(124,92,191,.06);}
.biometric-btn{width:100%;padding:12px;border-radius:12px;background:var(--s2);
border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;
display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;
font-family:'DM Sans',sans-serif;color:var(--text);transition:.2s;}
.biometric-btn:hover{background:var(--s3);}
.tg-verify-btn{width:100%;padding:14px;border-radius:12px;font-size:14px;font-weight:700;
border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s;margin-bottom:8px;}
.tg-verify-btn.active{background:linear-gradient(135deg,var(--purple),var(--purple-l));color:#fff;}
.tg-verify-btn:disabled{background:var(--s3);color:var(--tm);cursor:not-allowed;}
.tg-cancel-btn{background:none;border:none;color:var(--tm);font-size:13px;
cursor:pointer;font-family:'DM Sans',sans-serif;}

/* Policy pill */
.zt-policy-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;
border-radius:10px;background:rgba(26,158,92,.06);border:1px solid rgba(26,158,92,.15);
font-size:11.5px;color:#1a9e5c;font-weight:600;margin-bottom:14px;}

/* Mini trust indicators */
.enc-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
padding:2px 8px;border-radius:8px;background:rgba(26,158,92,.08);
border:1px solid rgba(26,158,92,.2);color:var(--green);}

/* Step-up Auth Modal */
.su-overlay{position:fixed;inset:0;background:rgba(15,15,25,.6);
  z-index:9000;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);animation:fadeIn .2s ease;}
.su-card{background:#fff;border-radius:20px;padding:32px;width:380px;
  box-shadow:0 24px 60px rgba(0,0,0,.2);animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:none;opacity:1;}}
.su-header{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px;}
.su-icon{width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--purple-l));
  display:flex;align-items:center;justify-content:center;font-size:28px;}
.su-title{font-size:18px;font-weight:800;text-align:center;}
.su-sub{font-size:12.5px;color:var(--tm);text-align:center;line-height:1.6;}

/* Security Centre */
.sec-center-wrap{max-width:700px;}
.sec-score-ring{position:relative;width:130px;height:130px;margin:0 auto;}
.sc-circle-bg{fill:none;stroke:var(--s3);stroke-width:12;}
.sc-circle-fill{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.sc-score-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center;}
.sc-score-num{font-size:32px;font-weight:900;line-height:1;}
.sc-score-txt{font-size:10px;color:var(--tm);margin-top:2px;}
.sec-metric{display:flex;align-items:center;gap:12px;padding:13px 16px;
  background:var(--s1);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.sec-metric-icon{font-size:22px;flex-shrink:0;}
.sec-metric-info{flex:1;}
.sec-metric-label{font-size:13px;font-weight:600;}
.sec-metric-sub{font-size:11px;color:var(--tm);margin-top:2px;}
.sec-metric-action{flex-shrink:0;}
.trust-bar-wrap{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden;}
.trust-bar-fill{height:100%;border-radius:3px;transition:.6s;}
.audit-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(0,0,0,.05);}
.audit-row:last-child{border-bottom:none;}
.audit-icon-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;}
.audit-info{flex:1;}
.audit-action{font-size:12.5px;font-weight:600;}
.audit-meta{font-size:11px;color:var(--tm);margin-top:2px;}
.audit-time{font-size:10.5px;color:var(--td);white-space:nowrap;flex-shrink:0;}
.device-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--s1);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.device-row-icon{font-size:24px;flex-shrink:0;}
.device-row-info{flex:1;}
.device-row-name{font-size:13px;font-weight:600;}
.device-row-meta{font-size:11px;color:var(--tm);margin-top:2px;}
.device-row-badge{font-size:10px;padding:2px 9px;border-radius:10px;font-weight:700;}
.device-row-badge.current{background:rgba(26,158,92,.1);color:#1a9e5c;}
.device-row-badge.trusted{background:rgba(124,92,191,.1);color:var(--purple-l);}
.device-row-badge.unknown{background:rgba(231,76,60,.1);color:var(--red);}

/* Session timeout warning */
.session-overlay{position:fixed;inset:0;background:rgba(15,15,25,.7);
  z-index:9500;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);}
.session-card{background:#fff;border-radius:20px;padding:36px;width:360px;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.session-countdown{font-size:52px;font-weight:900;color:var(--red);margin:12px 0;}
.session-count-ring{width:80px;height:80px;margin:0 auto 16px;}

/* Locked state */
.lock-screen{position:fixed;inset:0;background:linear-gradient(135deg,#f0eaff,#faf8ff);
  z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
</style>
</head>

function getAIResponse(msg){
  const lower=msg.toLowerCase();
  if(lower.includes('watch')||lower.includes('timepiece')) return AI_RESPONSES.watch[0];
  if(lower.includes('shoe')||lower.includes('sneaker')||lower.includes('nike')) return AI_RESPONSES.shoe[0];
  if(lower.includes('deal')||lower.includes('discount')||lower.includes('sale')||lower.includes('offer')) return AI_RESPONSES.deal[0];
  if(lower.includes('tech')||lower.includes('headphone')||lower.includes('earbud')||lower.includes('speaker')) return AI_RESPONSES.tech[0];
  if(lower.includes('luxury')||lower.includes('premium')||lower.includes('chanel')) return AI_RESPONSES.luxury[0];
  if(lower.includes('help')||lower.includes('can you')||lower.includes('what can')) return AI_RESPONSES.help[0];
  return AI_RESPONSES.default[Math.floor(Math.random()*AI_RESPONSES.default.length)];
}

/* ════════════════════ HELPERS ════════════════════ */
const fmt=(n)=>'$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const stars=(r)=>'★'.repeat(Math.floor(r))+'☆'.repeat(5-Math.floor(r));
const pct=(now,was)=>'-'+Math.round((1-now/was)*100)+'%';

/* ════════════════════ SHARED COMPONENTS ════════════════════ */
function Toast({toast}){
  if(!toast)return null;
  return <div className={`toast toast-${toast.type||'success'}`}>{toast.msg}</div>;
}

function Stars({rating}){
  return <span style={{color:'var(--gold)',fontSize:'12px'}}>{stars(rating)} <span style={{color:'var(--tm)',fontSize:'11px'}}>({Math.floor(rating*10)/10})</span></span>;
}

function WishBtn({id,wishlist,toggle,product}){
  const on=wishlist.has(id);
  return <button className={`wish-btn ${on?'on':''}`} onClick={e=>{e.stopPropagation();toggle(product);}}>{on?'♥':'♡'}</button>;
}

function ProductCard({p,onView,onCart,wishlist,toggleWishlist}){
  return(
    <div className="prod-card" onClick={()=>onView(p)}>
      <WishBtn id={p.id} wishlist={wishlist} toggle={toggleWishlist} product={p}/>
      <div className="prod-img">{p.emoji}</div>
      <div className="prod-name">{p.name}</div>
      <div className="prod-sub">{p.cat}</div>
      <div className="prod-stars">{stars(p.rating)} <span style={{color:'var(--td)',fontSize:'10px'}}>({p.reviews})</span></div>
      <div className="prod-price">
        <span className="price-now">{fmt(p.price)}</span>
        <span className="price-was">{fmt(p.was)}</span>
        <span className="price-badge">{pct(p.price,p.was)}</span>
      </div>
      <button className="add-cart-btn" onClick={e=>{e.stopPropagation();onCart(p);}}>Add to Cart</button>
    </div>
  );
}

    <div>

}

/* ════════════ HIGHLIGHT HELPER ════════════ */
function Highlight({text,query}){
  if(!query||!query.trim()) return <span>{text}</span>;
  const idx=text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return <span>{text}</span>;
  return <span>{text.slice(0,idx)}<mark>{text.slice(idx,idx+query.length)}</mark>{text.slice(idx+query.length)}</span>;
}

/* ════════════ SHOPPING: SEARCH PAGE ════════════ */
function SearchPage({query,nav,addToCart,wishlist,toggleWishlist,onNewSearch}){
  const products = useContext(ProductsCtx)||PRODUCTS;
  const [catFilter,setCatFilter]=useState('All');
  const [sort,setSort]=useState('relevance');
  const [minP,setMinP]=useState('');
  const [maxP,setMaxP]=useState('');
  const [view,setView]=useState('grid'); // grid | list

  const results=useMemo(()=>{
    let ps=[...products];
    // text filter
    if(query&&query.trim()){
      const q=query.toLowerCase();
      ps=ps.filter(p=>
        p.name.toLowerCase().includes(q)||
        p.cat.toLowerCase().includes(q)||
        p.desc.toLowerCase().includes(q)
      );
    }
    // category
    if(catFilter!=='All') ps=ps.filter(p=>p.cat===catFilter);
    // price range
    if(minP!=='') ps=ps.filter(p=>p.price>=parseFloat(minP));
    if(maxP!=='') ps=ps.filter(p=>p.price<=parseFloat(maxP));
    // sort
    if(sort==='price_asc') ps.sort((a,b)=>a.price-b.price);
    else if(sort==='price_desc') ps.sort((a,b)=>b.price-a.price);
    else if(sort==='rating') ps.sort((a,b)=>b.rating-a.rating);
    else if(sort==='discount') ps.sort((a,b)=>(1-a.price/a.was)-(1-b.price/b.was));
    else if(sort==='relevance'&&query){
      const q=query.toLowerCase();
      ps.sort((a,b)=>{
        const aName=a.name.toLowerCase().includes(q)?1:0;
        const bName=b.name.toLowerCase().includes(q)?1:0;
        return bName-aName;
      });
    }
    return ps;
  },[query,catFilter,sort,minP,maxP]);

  const hasFilters=catFilter!=='All'||minP||maxP;
  const clearAll=()=>{setCatFilter('All');setMinP('');setMaxP('');setSort('relevance');};

  const RELATED=['Watch','Shoes','Tech','Luxury','Kitchen','Fashion'];

  return(
    <div>
      {/* STATS BAR */}
      <div className="search-stats-bar">
        <div className="ssb-left">
          {query?<><span className="ssb-count">Showing</span><span style={{fontSize:'20px',fontWeight:'800',color:'var(--gold)'}}>{results.length}</span><span className="ssb-count">results for</span><span className="ssb-q">"{query}"</span></>
          :<><span style={{fontSize:'20px',fontWeight:'800',color:'var(--gold)'}}>{results.length}</span><span className="ssb-count">products</span></>}
          {catFilter!=='All'&&<span className="ssb-tag">{catFilter}<button onClick={()=>setCatFilter('All')}>×</button></span>}
          {(minP||maxP)&&<span className="ssb-tag">${minP||'0'} – ${maxP||'∞'}<button onClick={()=>{setMinP('');setMaxP('');}}>×</button></span>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          {hasFilters&&<button className="clear-all" onClick={clearAll}>Clear all filters</button>}
          <button onClick={()=>setView(v=>v==='grid'?'list':'grid')}
            style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'8px',
              padding:'6px 10px',fontSize:'13px',cursor:'pointer',color:'var(--text)'}}>
            {view==='grid'?'⊟':'⊞'}
          </button>
        </div>
      </div>

      {/* TOOLBAR */}
      <div className="search-toolbar">
        {/* Categories */}
        <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
          {CATEGORIES.map(c=>(
            <button key={c} className={`filter-btn ${catFilter===c?'on':''}`} onClick={()=>setCatFilter(c)}>{c}</button>
          ))}
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}}>
          {/* Price Range */}
          <div className="price-inputs">
            <span>$</span>
            <input className="price-inp" value={minP} onChange={e=>setMinP(e.target.value)} placeholder="Min"/>
            <span>—</span>
            <input className="price-inp" value={maxP} onChange={e=>setMaxP(e.target.value)} placeholder="Max"/>
          </div>
          {/* Sort */}
          <select className="sort-select" value={sort} onChange={e=>setSort(e.target.value)}>
            <option value="relevance">Most Relevant</option>
            <option value="price_asc">Price: Low → High</option>
            <option value="price_desc">Price: High → Low</option>
            <option value="rating">Highest Rated</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>

      {/* RESULTS */}
      {results.length===0?(
        <div className="no-results">
          <div className="nr-icon">🔍</div>
          <div className="nr-title">No results found</div>
          <div className="nr-sub">We couldn't find anything matching <strong>"{query}"</strong>{catFilter!=='All'?` in ${catFilter}`:''}</div>
          <div style={{marginBottom:'20px',fontSize:'13px',color:'var(--tm)'}}>Try searching for:</div>
          <div className="nr-suggestions">
            {RELATED.map(s=><button key={s} className="nr-sug" onClick={()=>onNewSearch&&onNewSearch(s)}>{s}</button>)}
          </div>
          <button className="hero-btn" style={{marginTop:'24px'}} onClick={()=>nav('home')}>Back to Home</button>
        </div>
      ):view==='grid'?(
        <div className="products-grid">
          {results.map(p=>(
            <div key={p.id} className="prod-card" onClick={()=>nav('product',{product:p})}>
              <button className={`wish-btn ${wishlist.has(p.id)?'on':''}`} onClick={e=>{e.stopPropagation();toggleWishlist(p);}}>{wishlist.has(p.id)?'♥':'♡'}</button>
              <div className="prod-img">{p.emoji}</div>
              <div className="prod-name"><Highlight text={p.name} query={query}/></div>
              <div className="prod-sub">{p.cat}</div>
              <div className="prod-stars">{'★'.repeat(Math.floor(p.rating))+'☆'.repeat(5-Math.floor(p.rating))} <span style={{color:'var(--td)',fontSize:'10px'}}>({p.reviews})</span></div>
              <div className="prod-price">
                <span className="price-now">{fmt(p.price)}</span>
                <span className="price-was">{fmt(p.was)}</span>
                <span className="price-badge">{pct(p.price,p.was)}</span>
              </div>
              <button className="add-cart-btn" onClick={e=>{e.stopPropagation();addToCart(p);}}>Add to Cart</button>
            </div>
          ))}
        </div>
      ):(
        /* LIST VIEW */
        <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
          {results.map(p=>(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:'16px',background:'var(--s1)',
              border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'14px',cursor:'pointer',transition:'.2s'}}
              onClick={()=>nav('product',{product:p})}>
              <div style={{fontSize:'48px',width:'70px',textAlign:'center',flexShrink:0}}>{p.emoji}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:'14px',fontWeight:'700',marginBottom:'3px'}}><Highlight text={p.name} query={query}/></div>
                <div style={{fontSize:'11px',color:'var(--tm)',marginBottom:'5px'}}>{p.cat} · <Highlight text={p.desc.slice(0,60)+'…'} query={query}/></div>
                <div style={{color:'var(--gold)',fontSize:'11px',marginBottom:'6px'}}>{'★'.repeat(Math.floor(p.rating))+'☆'.repeat(5-Math.floor(p.rating))} <span style={{color:'var(--td)',fontSize:'10px'}}>({p.reviews})</span></div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{fontSize:'20px',fontWeight:'800',marginBottom:'3px'}}>{fmt(p.price)}</div>
                <div style={{fontSize:'11px',color:'var(--td)',textDecoration:'line-through',marginBottom:'5px'}}>{fmt(p.was)}</div>
                <div style={{marginBottom:'8px'}}><span style={{background:'rgba(231,76,60,.12)',color:'var(--red)',fontSize:'11px',fontWeight:'700',padding:'2px 7px',borderRadius:'4px'}}>{pct(p.price,p.was)}</span></div>
                <button className="add-cart-btn" style={{width:'120px'}} onClick={e=>{e.stopPropagation();addToCart(p);}}>Add to Cart</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ════════════ SHOPPING: CART PAGE ════════════ */
function CartPage({cart,removeFromCart,updateQty,nav,showToast}){
  const {addOrder}=useContext(AppCtx);
  const clearCart=()=>cart.forEach(i=>removeFromCart(i.id)); // fallback — real clearCart passed via ShoppingApp
  const [orderId,setOrderId]=useState(null);
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const shipping=total>=100?0:9.99;
  const tax=total*0.08;
  const grandTotal=total+shipping+tax;

  const handleCheckout=()=>{
    const id=addOrder(cart,grandTotal);
    setOrderId(id);

  };

  if(orderId) return(
    <div className="order-success">

      <button style={{background:'none',border:'none',color:'var(--tm)',cursor:'pointer',fontSize:'13px'}} onClick={()=>nav('home')}>Continue Shopping</button>
    </div>
  );

  if(cart.length===0) return(
    <div className="empty-state"><div className="es-icon">🛒</div><h3>Your cart is empty</h3><p>Add some products to your cart to get started</p><button className="hero-btn" onClick={()=>nav('home')}>Start Shopping</button></div>

                  <button className="ci-remove" onClick={()=>removeFromCart(item.id)}>🗑</button>

                <div style={{fontSize:'11px',color:'var(--tm)'}}>x{item.qty}</div>

        </div>
        <div className="cart-summary">

          <div className="cs-row"><span>Tax (8%)</span><span>{fmt(tax)}</span></div>

/* ════════════ SHOPPING: AI ASSISTANT ════════════ */
function AIAssistantPage(){
  const [msgs,setMsgs]=useState([{role:'ai',text:"👋 Hi! I'm your AI Shopping Assistant. Ask me anything about products, deals, or recommendations!"}]);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const bottomRef=useRef(null);
  const SUGGESTIONS=['Find luxury watches under $200','Show me today\'s best deals','What\'s new in Tech?','Recommend a gift under $100'];

  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:'smooth'}),[msgs,typing]);

  const send=(txt)=>{
    const q=txt||input.trim();
    if(!q) return;
    setInput('');
    setMsgs(m=>[...m,{role:'user',text:q}]);
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      setMsgs(m=>[...m,{role:'ai',text:getAIResponse(q)}]);
    },1200+Math.random()*600);
  };

  return(
    <div>
      <div className="sec-title" style={{marginBottom:'16px'}}>AI Shopping Assistant</div>
      <div className="ai-chat-wrap">
        <div className="ai-chat-main">
          <div className="chat-suggestions">
            {SUGGESTIONS.map(s=><button key={s} className="chat-sug" onClick={()=>send(s)}>{s}</button>)}
          </div>
          <div className="chat-msgs">
            {msgs.map((m,i)=>(
              <div key={i} className={`chat-msg-${m.role}`}>
                {m.role==='ai'&&<div className="ai-tag">✨ AI Assistant</div>}
                <div style={{whiteSpace:'pre-line'}}>{m.text}</div>
              </div>
            ))}
            {typing&&<div className="chat-msg-ai"><div className="ai-tag">✨ AI Assistant</div><div className="chat-typing"><div className="typing-dot"/><div className="typing-dot"/><div className="typing-dot"/></div></div>}
            <div ref={bottomRef}/>
          </div>
          <div className="chat-input-row">
            <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Ask anything about products…"/>
            <button className="chat-send" onClick={()=>send()}>→</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function VoiceSearchPage({nav,addToCart,wishlist,toggleWishlist}){
  const products = useContext(ProductsCtx)||PRODUCTS;
  const [state,setState]=useState('idle');
  const [query,setQuery]=useState('');
  const QUERIES=['Show me luxury watches','Find deals on sneakers','Kitchen products under $100','Best tech gifts'];

    setState('listening');

          </div>

        </div>
      )}
      {state==='processing'&&(
        <div className="voice-page">
          <div style={{fontSize:'40px',animation:'spin 1s linear infinite'}}>⚙️</div>
          <div className="vp-title">Processing…</div>

  );

  );

function MessagesPage(){
  const [selected,setSelected]=useState(1);
  const [inputs,setInputs]=useState({});
  const [convs,setConvs]=useState(MESSAGES.reduce((acc,m)=>({...acc,[m.id]:[...m.msgs]}),{}));

  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:'smooth'}),[selected,convs]);

  const sendMsg=(id)=>{
    const txt=(inputs[id]||'').trim();
    if(!txt)return;
    setConvs(c=>({...c,[id]:[...c[id],{from:false,text:txt,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}]}));
    setInputs(i=>({...i,[id]:''}));

  const thread=MESSAGES.find(m=>m.id===selected);

          <div className="mca-messages">

              <div key={i} className={`mca-msg ${msg.from?'them':'me'}`}>{msg.text}<div style={{fontSize:'9.5px',marginTop:'4px',opacity:.6,textAlign:msg.from?'left':'right'}}>{msg.time}</div></div>

  );

/* ════════════════════ SEARCH BAR COMPONENT ════════════════════ */
function SearchBar({onSearch,onNav}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const [activeIdx,setActiveIdx]=useState(-1);
  const [recent,setRecent]=useState(['luxury watches','nike shoes','wireless earbuds','kitchen set']);
  const wrapRef=useRef(null);
  const inputRef=useRef(null);

  const TRENDING=[
    {text:'Luxury watches under $200',cat:'Luxury',emoji:'⌚'},
    {text:'Nike sneakers sale',cat:'Sports',emoji:'👟'},
    {text:'Wireless headphones',cat:'Tech',emoji:'🎧'},
    {text:'Smart home devices',cat:'Lifestyle',emoji:'💡'},
    {text:'Fashion accessories',cat:'Fashion',emoji:'👗'},
  ];

  const suggestions=useMemo(()=>{
    if(!q.trim()) return [];
    const lower=q.toLowerCase();
    return PRODUCTS.filter(p=>
      p.name.toLowerCase().includes(lower)||
      p.cat.toLowerCase().includes(lower)
    ).slice(0,6);
  },[q]);

  const showDrop=open;

  // close on outside click
  useEffect(()=>{
    const handler=(e)=>{if(wrapRef.current&&!wrapRef.current.contains(e.target)) setOpen(false);};
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[]);

  const commit=(text)=>{
    const trimmed=text.trim();
    if(!trimmed) return;
    setRecent(r=>{const next=[trimmed,...r.filter(x=>x!==trimmed)].slice(0,6);return next;});
    setOpen(false);
    setActiveIdx(-1);
    onSearch(trimmed);
  };

  const handleKey=(e)=>{
    const items=q.trim()?suggestions:TRENDING;
    if(e.key==='ArrowDown'){e.preventDefault();setActiveIdx(i=>Math.min(i+1,items.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setActiveIdx(i=>Math.max(i-1,-1));}
    else if(e.key==='Enter'){
      e.preventDefault();
      if(activeIdx>=0&&items[activeIdx]){
        const item=items[activeIdx];
        commit(item.text||item.name);
      } else {
        commit(q);
      }
    }
    else if(e.key==='Escape'){setOpen(false);setActiveIdx(-1);}
  };

  const removeRecent=(r,e)=>{e.stopPropagation();setRecent(rs=>rs.filter(x=>x!==r));};

  return(
    <div className="search-wrap" ref={wrapRef}>
      <div className={`search-box ${open?'open':''}`}>
        <span className="search-icon-btn" onClick={()=>{if(q.trim())commit(q);else inputRef.current?.focus();}}>🔍</span>
        <input
          ref={inputRef}
          value={q}
          onChange={e=>{setQ(e.target.value);setActiveIdx(-1);if(!open)setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onKeyDown={handleKey}
          placeholder="Search for products, brands and more…"
        />
        {q&&<span className="search-clear" onClick={()=>{setQ('');setActiveIdx(-1);inputRef.current?.focus();}}>✕</span>}
        <span style={{fontSize:'13px',cursor:'pointer',color:'var(--tm)',flexShrink:0}} title="Voice search" onClick={()=>{setOpen(false);onNav('voice');}}>🎤</span>
        <span style={{fontSize:'13px',cursor:'pointer',color:'var(--tm)',flexShrink:0}} title="Image search" onClick={()=>{setOpen(false);onNav('image');}}>📷</span>
      </div>

      {showDrop&&(
        <div className="search-dropdown">
          {/* No query: show recent + trending */}
          {!q.trim()&&(
            <>
              {recent.length>0&&(
                <div className="sd-section">
                  <div className="sd-section-hdr">Recent Searches</div>
                  {recent.map((r,i)=>(
                    <div key={i} className={`sd-row ${activeIdx===i?'active-row':''}`}
                      onMouseEnter={()=>setActiveIdx(i)}
                      onClick={()=>commit(r)}>
                      <span className="sd-row-icon">🕐</span>
                      <span className="sd-row-text">{r}</span>
                      <span className="sd-row-meta" onClick={e=>removeRecent(r,e)} style={{color:'var(--td)',cursor:'pointer',fontSize:'14px'}}>✕</span>
                    </div>
                  ))}
                </div>
              )}
              <div className="sd-divider"/>
              <div className="sd-section">
                <div className="sd-section-hdr">Trending Now 🔥</div>
                {TRENDING.map((t,i)=>{
                  const idx=recent.length+i;
                  return(
                    <div key={i} className={`sd-row ${activeIdx===idx?'active-row':''}`}
                      onMouseEnter={()=>setActiveIdx(idx)}
                      onClick={()=>commit(t.text)}>
                      <span className="sd-row-icon">{t.emoji}</span>
                      <span className="sd-row-text">{t.text}</span>
                      <span className="sd-row-cat">{t.cat}</span>
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {/* Has query: show product suggestions */}
          {q.trim()&&(
            <>
              {suggestions.length>0&&(
                <div className="sd-section">
                  <div className="sd-section-hdr">Products</div>
                  {suggestions.map((p,i)=>(
                    <div key={p.id} className={`sd-row ${activeIdx===i?'active-row':''}`}
                      onMouseEnter={()=>setActiveIdx(i)}
                      onClick={()=>{setOpen(false);onNav('product',{product:p});}}>
                      <span className="sd-row-icon">{p.emoji}</span>
                      <span className="sd-row-text"><Highlight text={p.name} query={q}/></span>
                      <span className="sd-row-cat">{p.cat}</span>
                      <span className="sd-row-meta">{fmt(p.price)}</span>
                    </div>
                  ))}
                </div>
              )}
              <div className="sd-divider"/>
              <div className="sd-row" style={{justifyContent:'center',color:'var(--purple-l)',fontWeight:'600'}}
                onClick={()=>commit(q)}>
                <span className="sd-row-icon">🔍</span>
                <span className="sd-row-text">Search all results for "<strong>{q}</strong>"</span>
                <span style={{fontSize:'16px',color:'var(--purple-l)'}}>→</span>
              </div>
              {suggestions.length===0&&(
                <div style={{padding:'20px',textAlign:'center',color:'var(--tm)',fontSize:'13px'}}>
                  No products match "<strong style={{color:'var(--text)'}}>{q}</strong>"
                  <div style={{marginTop:'8px',fontSize:'12px'}}>Press Enter to search anyway</div>
                </div>
              )}
            </>
          )}

          <div className="sd-footer">
            <span><span className="sd-kbd">↑↓</span> Navigate</span>
            <span><span className="sd-kbd">Enter</span> Search</span>
            <span><span className="sd-kbd">Esc</span> Close</span>
          </div>
        </div>
      )}
    </div>
  );
}

const EMOJI_CATS={
  'All':  ['⌚','👟','🎧','💻','📱','👗','🕶','👜','🧥','🍳','☕','💡','🛋','🧴','🔊','🧘','💎','🎁','📦','🏋','🚴','🎮','🖥','⌨','🖱','📷','🎬','🎸','🎹','🎺','⚽','🏀','🏈','🎾','🏊','🧴','💄','👒','👠','👞','🛁','🪴','🕯','🧺','🪑'],
  'Fashion':['👗','👜','🕶','🧥','👒','👠','👞','💍','⌚','👔','🧤','🧣'],
  'Tech':  ['💻','📱','🎧','🔊','🖥','⌨','🖱','📷','🎮','⌚','📡','🔋'],
  'Sports':['⚽','🏀','🏈','🎾','🏊','🧘','🏋','🚴','🥊','🎿','🏄','🤸'],
  'Home':  ['🍳','☕','💡','🛋','🧺','🪴','🕯','🪑','🛁','🪟','🧹','🛏'],
  'Luxury':['💎','⌚','👜','🥂','✈','🏨','💐','🎁','🏺','🖼'],
};

function AddProductForm({editId,initialForm,EMOJIS,onSaved,onCancel}){
  const BLANK={name:'',cat:'Luxury',price:'',was:'',desc:'',stock:'',emoji:'⌚',status:'live',sku:'',tags:'',lowStockAt:'5'};
  const [form,setForm]=useState(initialForm&&initialForm.name?initialForm:{...BLANK});
  const [errors,setErrors]=useState({});
  const [imgFile,setImgFile]=useState(null);
  const [imgPreview,setImgPreview]=useState(initialForm?.imageUrl||null);
  const [imgError,setImgError]=useState('');
  const [dragOver,setDragOver]=useState(false);
  const [emojiSearch,setEmojiSearch]=useState('');
  const [emojiCat,setEmojiCat]=useState('All');
  const [uploading,setUploading]=useState(false);
  const [uploadPhase,setUploadPhase]=useState('');
  const [apiError,setApiError]=useState('');
  const [done,setDone]=useState(false);
  const [savedProduct,setSavedProduct]=useState(null);
  const fileRef=useRef(null);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  /* ── derived pricing ── */
  const price=parseFloat(form.price)||0;
  const was=parseFloat(form.was)||0;
  const discountPct=was>price&&was>0?Math.round((1-price/was)*100):0;
  const stockNum=parseInt(form.stock)||0;
  const stockStatus=stockNum===0?{label:'Out of Stock',color:'var(--red)'}:stockNum<parseInt(form.lowStockAt||5)?{label:`Low Stock (${stockNum})`,color:'#f39c12'}:{label:`In Stock (${stockNum})`,color:'var(--green)'};

  /* ── image handling ── */
  const handleFile=(file)=>{
    if(!file) return;
    setImgError('');
    const allowed=['image/jpeg','image/png','image/webp','image/gif'];
    if(!allowed.includes(file.type)){setImgError('Only JPG, PNG, WebP, or GIF images are allowed.');return;}
    if(file.size>5*1024*1024){setImgError('Image must be under 5 MB.');return;}
    setImgFile(file);
    const reader=new FileReader();
    reader.onload=e=>setImgPreview(e.target.result);
    reader.readAsDataURL(file);
  };
  const onDrop=(e)=>{e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0]);};

  /* ── emoji list ── */
  const emojiList=useMemo(()=>{
    let list=EMOJI_CATS[emojiCat]||EMOJI_CATS['All'];
    if(emojiSearch) list=EMOJI_CATS['All'].filter(e=>e.includes(emojiSearch));
    return list;
  },[emojiCat,emojiSearch]);

  /* ── validation ── */
  const validate=()=>{
    const e={};
    if(!form.name.trim()||form.name.trim().length<3) e.name='Product name must be at least 3 characters';
    if(form.name.trim().length>80) e.name='Product name must be under 80 characters';
    if(!form.price||price<=0) e.price='Enter a valid selling price greater than 0';
    if(price>999999) e.price='Price cannot exceed $999,999';
    if(was>0&&was<=price) e.was='Original price must be higher than the selling price';
    if(!form.stock&&form.stock!=='0') e.stock='Stock quantity is required';
    if(stockNum<0) e.stock='Stock cannot be negative';
    if(stockNum>100000) e.stock='Stock quantity cannot exceed 100,000';
    if(!form.desc.trim()||form.desc.trim().length<10) e.desc='Description must be at least 10 characters';
    if(form.desc.trim().length>300) e.desc='Description must be under 300 characters';
    if(!form.emoji) e.emoji='Please select a product icon';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  /* ── simulated API submit ── */
  const submit=async()=>{
    if(!validate()) return;
    setApiError('');
    setUploading(true);

    // Phase 1: image upload
    if(imgFile){
      setUploadPhase('📤 Uploading product image…');
      await new Promise(r=>setTimeout(r,900));
    }

    // Phase 2: create product
    setUploadPhase('✨ Creating your listing…');
    await new Promise(r=>setTimeout(r,800));

    // Phase 3: SEO optimise
    setUploadPhase('🔍 Optimising for search…');
    await new Promise(r=>setTimeout(r,500));

    // Simulate occasional API error (demo purposes)
    if(Math.random()<0.06){
      setUploading(false);
      setApiError('Server error: Could not create listing. Please try again.');
      return;
    }

    const newProd={
      id:Date.now(),
      emoji:form.emoji,
      imageUrl:imgPreview,
      name:form.name.trim(),
      cat:form.cat,
      price,
      was:was||null,
      stock:stockNum,
      sold:0,
      status:form.status,
      views:0,
      desc:form.desc.trim(),
      sku:form.sku||`SKU-${Date.now().toString(36).toUpperCase()}`,
      tags:form.tags,
      lowStockAt:parseInt(form.lowStockAt)||5,
      createdAt:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    };

    setUploading(false);
    setSavedProduct(newProd);
    setDone(true);
    setTimeout(()=>onSaved(newProd),2200);
  };

  /* ── done screen ── */
  if(done&&savedProduct) return(
    <div className="api-success-box">
      <div style={{fontSize:'64px',marginBottom:'14px',animation:'bounceIn .5s ease'}}>🎉</div>
      <div style={{fontSize:'22px',fontWeight:'800',marginBottom:'6px',color:'var(--green)'}}>{editId?'Listing Updated!':'Product Listed!'}</div>
      <div style={{fontSize:'14px',color:'var(--tm)',marginBottom:'20px'}}>"{savedProduct.name}" is now {savedProduct.status==='live'?'live on the marketplace':'saved as a draft'}.</div>
      <div className="prod-preview-card" style={{maxWidth:'380px',margin:'0 auto 20px'}}>
        <div className="ppc-img">{savedProduct.imageUrl?<img src={savedProduct.imageUrl} alt={savedProduct.name}/>:savedProduct.emoji}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:'15px',fontWeight:'700'}}>{savedProduct.name}</div>
          <div style={{fontSize:'13px',color:'var(--tm)',marginTop:'2px'}}>{savedProduct.cat}</div>
          <div style={{fontSize:'17px',fontWeight:'800',marginTop:'4px',color:'var(--gold)'}}>${savedProduct.price.toFixed(2)}</div>
          {savedProduct.status==='live'&&<div className="ppc-live-badge">🟢 Live</div>}
        </div>
      </div>
      <div style={{fontSize:'12px',color:'var(--td)'}}>Redirecting to your listings…</div>
    </div>
  );

  /* ── loading screen ── */
  if(uploading) return(
    <div className="api-loading">
      <div className="api-spinner"/>
      <div style={{fontSize:'16px',fontWeight:'700'}}>{uploadPhase}</div>
      <div className="api-phase">This usually takes a few seconds</div>
    </div>
  );

  const steps=['📷 Media','📝 Details','💰 Pricing','📦 Inventory'];

  return(
    <div className="apf-wrap">
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
        <div>
          <div className="sec-title" style={{marginBottom:'3px'}}>{editId?'✏️ Edit Listing':'➕ Add New Product'}</div>
          <div style={{fontSize:'12px',color:'var(--tm)'}}>Fill all required * fields to publish your listing</div>
        </div>
        {editId&&<button onClick={onCancel} style={{padding:'8px 16px',borderRadius:'8px',background:'var(--s2)',border:'1px solid var(--border)',cursor:'pointer',fontSize:'13px',color:'var(--text)'}}>✕ Cancel Edit</button>}
      </div>

      {/* API Error Banner */}
      {apiError&&(
        <div className="api-error-box" style={{marginBottom:'16px',display:'flex',alignItems:'flex-start',gap:'10px'}}>
          <span style={{fontSize:'20px'}}>⚠️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:'13px',fontWeight:'700',color:'var(--red)',marginBottom:'3px'}}>Failed to create listing</div>
            <div style={{fontSize:'12px',color:'var(--tm)'}}>{apiError}</div>
          </div>
          <button onClick={()=>setApiError('')} style={{background:'none',border:'none',color:'var(--td)',cursor:'pointer',fontSize:'16px'}}>✕</button>
        </div>
      )}

      {/* ── SECTION 1: Product Image ── */}
      <div className="apf-section">
        <div className="apf-section-title">📷 Product Image</div>
        <input ref={fileRef} type="file" accept="image/jpeg,image/png,image/webp,image/gif" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
        <div
          className={`img-upload-zone ${dragOver?'drag-over':''} ${imgPreview?'has-image':''}`}
          onDragOver={e=>{e.preventDefault();setDragOver(true);}}
          onDragLeave={()=>setDragOver(false)}
          onDrop={onDrop}
          onClick={()=>!imgPreview&&fileRef.current?.click()}>
          {imgPreview?(
            <>
              <img src={imgPreview} className="img-preview" alt="product preview"/>
              <button className="img-remove-btn" onClick={e=>{e.stopPropagation();setImgPreview(null);setImgFile(null);}}>✕</button>
            </>
          ):(
            <>
              <div className="img-upload-icon">{dragOver?'📂':'🖼'}</div>
              <div className="img-upload-title">{dragOver?'Drop image here':'Upload Product Image'}</div>
              <div className="img-upload-sub">Drag & drop, or click to browse · JPG, PNG, WebP · Max 5 MB</div>
              <div className="img-upload-btn">Choose Image</div>
            </>
          )}
        </div>
        {imgError&&<div className="img-validation-error">⚠️ {imgError}</div>}
        {imgPreview&&(
          <div style={{display:'flex',gap:'10px',marginTop:'10px'}}>
            <button onClick={()=>fileRef.current?.click()} style={{padding:'8px 16px',borderRadius:'8px',background:'var(--s2)',border:'1px solid var(--border)',cursor:'pointer',fontSize:'12px',fontWeight:'600',color:'var(--text)'}}>🔄 Change Image</button>
            <div style={{fontSize:'11px',color:'var(--green)',display:'flex',alignItems:'center',gap:'5px',fontWeight:'600'}}>✅ Image ready to upload</div>
          </div>
        )}
        {!imgPreview&&<div style={{fontSize:'11px',color:'var(--td)',marginTop:'8px'}}>If no image is uploaded, the selected icon will be used as the product thumbnail.</div>}
      </div>

      {/* ── SECTION 2: Icon Selector ── */}
      <div className="apf-section">
        <div className="apf-section-title">🎨 Product Icon <span style={{fontSize:'11px',fontWeight:'400',color:'var(--td)',textTransform:'none',letterSpacing:0}}>(used when no image is uploaded)</span></div>
        {errors.emoji&&<div className="form-error" style={{marginBottom:'10px'}}>⚠️ {errors.emoji}</div>}
        <div className="emoji-selected-preview">
          <span style={{fontSize:'42px'}}>{form.emoji}</span>
          <div>
            <div style={{fontSize:'13px',fontWeight:'700'}}>Selected Icon</div>
            <div style={{fontSize:'12px',color:'var(--tm)'}}>Click any icon below to change</div>
          </div>
        </div>
        <input className="emoji-search" value={emojiSearch} onChange={e=>setEmojiSearch(e.target.value)} placeholder="🔍  Search icons…"/>
        {!emojiSearch&&(
          <div className="emoji-cat-tabs">
            {Object.keys(EMOJI_CATS).map(c=>(
              <button key={c} className={`emoji-cat-tab ${emojiCat===c?'on':''}`} onClick={()=>setEmojiCat(c)}>{c}</button>
            ))}
          </div>
        )}
        <div className="emoji-grid">
          {emojiList.map(e=>(
            <div key={e} className={`emoji-opt ${form.emoji===e?'sel':''}`}
              onClick={()=>{setF('emoji',e);setErrors(er=>({...er,emoji:undefined}));}}
              title={e}>
              {e}
              {form.emoji===e&&<span style={{position:'absolute',bottom:'2px',right:'2px',fontSize:'9px',color:'var(--gold)'}}>✓</span>}
            </div>
          ))}
        </div>
      </div>

      {/* ── SECTION 3: Product Details ── */}
      <div className="apf-section">
        <div className="apf-section-title">📝 Product Details</div>
        <div className="add-prod-form">
          <div className="full">
            <div className="form-label">Product Name *</div>
            <input className={`form-input ${errors.name?'error':''}`} value={form.name}
              onChange={e=>{setF('name',e.target.value);if(errors.name)setErrors(er=>({...er,name:''}));}}
              placeholder="e.g. Premium Leather Wallet · max 80 chars"/>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}>
              {errors.name?<div className="form-error">{errors.name}</div>:<div/>}
              <div style={{fontSize:'11px',color:form.name.length>70?'var(--red)':'var(--td)'}}>{form.name.length}/80</div>
            </div>
          </div>
          <div>
            <div className="form-label">Category *</div>
            <select className="form-input" style={{cursor:'pointer'}} value={form.cat} onChange={e=>setF('cat',e.target.value)}>
              {['Luxury','Fashion','Tech','Kitchen','Lifestyle','Sports','Beauty','Automotive'].map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <div className="form-label">Listing Status</div>
            <select className="form-input" style={{cursor:'pointer'}} value={form.status} onChange={e=>setF('status',e.target.value)}>
              <option value="live">🟢 Live — visible to buyers</option>
              <option value="draft">📝 Draft — save for later</option>
              <option value="paused">⏸ Paused — hidden temporarily</option>
            </select>
          </div>
          <div className="full">
            <div className="form-label">Description * <span style={{color:'var(--td)',fontWeight:'400',fontSize:'11px'}}>min 10 chars</span></div>
            <textarea className={`form-input ${errors.desc?'error':''}`} rows={4}
              style={{resize:'vertical',lineHeight:'1.65'}} value={form.desc}
              onChange={e=>{setF('desc',e.target.value);if(errors.desc)setErrors(er=>({...er,desc:''}));}}
              placeholder="Describe your product — material, size, key features, condition, what's included…"/>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}>
              {errors.desc?<div className="form-error">{errors.desc}</div>:<div/>}
              <div style={{fontSize:'11px',color:form.desc.length>280?'var(--red)':'var(--td)'}}>{form.desc.length}/300</div>
            </div>
          </div>
          <div>
            <div className="form-label">SKU / Product Code <span style={{color:'var(--td)',fontWeight:'400',fontSize:'11px'}}>optional</span></div>
            <input className="form-input" value={form.sku} onChange={e=>setF('sku',e.target.value)} placeholder="e.g. LW-2026-BLK (auto-generated if blank)"/>
          </div>
          <div>
            <div className="form-label">Tags <span style={{color:'var(--td)',fontWeight:'400',fontSize:'11px'}}>optional — comma separated</span></div>
            <input className="form-input" value={form.tags} onChange={e=>setF('tags',e.target.value)} placeholder="e.g. leather, wallet, slim, gift"/>
          </div>
        </div>
      </div>

      {/* ── SECTION 4: Pricing ── */}
      <div className="apf-section">
        <div className="apf-section-title">💰 Pricing</div>
        <div className="price-row">
          <div>
            <div className="form-label">Selling Price ($) *</div>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',color:'var(--tm)',fontWeight:'700',fontSize:'15px'}}>$</span>
              <input className={`form-input ${errors.price?'error':''}`} type="number" min="0" step="0.01"
                value={form.price} onChange={e=>{setF('price',e.target.value);if(errors.price)setErrors(er=>({...er,price:''}));}}
                placeholder="0.00" style={{paddingLeft:'24px'}}/>
            </div>
            {errors.price&&<div className="form-error">{errors.price}</div>}
          </div>
          <div>
            <div className="form-label">Original Price ($) <span style={{color:'var(--td)',fontWeight:'400',fontSize:'11px'}}>optional</span></div>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',color:'var(--tm)',fontWeight:'700',fontSize:'15px'}}>$</span>
              <input className={`form-input ${errors.was?'error':''}`} type="number" min="0" step="0.01"
                value={form.was} onChange={e=>{setF('was',e.target.value);if(errors.was)setErrors(er=>({...er,was:''}));}}
                placeholder="0.00" style={{paddingLeft:'24px'}}/>
            </div>
            {errors.was&&<div className="form-error">{errors.was}</div>}
          </div>
          <div>
            <div className="form-label">Calculated Discount</div>
            <div style={{padding:'10px 14px',background:'var(--s2)',borderRadius:'8px',border:'1px solid var(--border)',minHeight:'42px',display:'flex',alignItems:'center'}}>
              {discountPct>0?(
                <span style={{fontSize:'18px',fontWeight:'800',color:'var(--red)'}}>{discountPct}% OFF</span>
              ):(
                <span style={{fontSize:'12px',color:'var(--td)'}}>Enter original price</span>
              )}
            </div>
          </div>
        </div>
        {/* Pricing summary */}
        {price>0&&(
          <div style={{background:'var(--s2)',borderRadius:'10px',padding:'12px 14px',fontSize:'12.5px',display:'flex',gap:'20px',flexWrap:'wrap'}}>
            <span><strong style={{color:'var(--text)'}}>Selling:</strong> <span style={{color:'var(--purple)',fontWeight:'700'}}>${price.toFixed(2)}</span></span>
            {was>0&&<span><strong style={{color:'var(--text)'}}>Was:</strong> <span style={{textDecoration:'line-through',color:'var(--td)'}}>${was.toFixed(2)}</span></span>}
            {discountPct>0&&<span><strong style={{color:'var(--text)'}}>Saving:</strong> <span style={{color:'var(--green)',fontWeight:'700'}}>${(was-price).toFixed(2)} ({discountPct}%)</span></span>}
            <span><strong style={{color:'var(--text)'}}>Platform fee (5%):</strong> <span style={{color:'var(--tm)'}}>-${(price*0.05).toFixed(2)}</span></span>
            <span><strong style={{color:'var(--text)'}}>You receive:</strong> <span style={{color:'var(--gold)',fontWeight:'700'}}>${(price*0.95).toFixed(2)}</span></span>
          </div>
        )}
      </div>

      {/* ── SECTION 5: Inventory ── */}
      <div className="apf-section">
        <div className="apf-section-title">📦 Inventory</div>
        <div className="add-prod-form">
          <div>
            <div className="form-label">Stock Quantity *</div>
            <input className={`form-input ${errors.stock?'error':''}`} type="number" min="0"
              value={form.stock} onChange={e=>{setF('stock',e.target.value);if(errors.stock)setErrors(er=>({...er,stock:''}));}}
              placeholder="e.g. 25"/>
            {errors.stock?<div className="form-error">{errors.stock}</div>:(
              stockNum>=0&&form.stock!==''&&<div className={`stock-status`} style={{color:stockStatus.color}}>
                <span>●</span>{stockStatus.label}
              </div>
            )}
          </div>
          <div>
            <div className="form-label">Low Stock Alert Threshold</div>
            <input className="form-input" type="number" min="1" value={form.lowStockAt}
              onChange={e=>setF('lowStockAt',e.target.value)} placeholder="e.g. 5"/>
            <div style={{fontSize:'11px',color:'var(--td)',marginTop:'4px'}}>Alert me when stock drops below this number</div>
          </div>
        </div>
        {stockNum>0&&(
          <div style={{marginTop:'10px'}}>
            <div style={{fontSize:'11px',color:'var(--tm)',marginBottom:'5px',fontWeight:'600'}}>STOCK LEVEL</div>
            <div style={{height:'8px',background:'var(--s2)',borderRadius:'4px',overflow:'hidden'}}>
              <div className="margin-bar" style={{
                width:`${Math.min(100,(stockNum/100)*100)}%`,
                background:stockNum<5?'var(--red)':stockNum<20?'#f39c12':'var(--green)'
              }}/>
            </div>
          </div>
        )}
      </div>

      {/* ── LIVE PREVIEW CARD ── */}
      <div className="apf-section">
        <div className="apf-section-title">👁 Live Preview</div>
        <div className="prod-preview-card">
          <div className="ppc-img">
            {imgPreview?<img src={imgPreview} alt="preview"/>:<span style={{fontSize:'36px'}}>{form.emoji}</span>}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:'15px',fontWeight:'700',marginBottom:'2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{form.name||<span style={{color:'var(--td)'}}>Product Name</span>}</div>
            <div style={{fontSize:'12px',color:'var(--tm)',marginBottom:'5px'}}>{form.cat}{form.sku?` · ${form.sku}`:''}</div>
            <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
              {price>0&&<span style={{fontSize:'18px',fontWeight:'800',color:'var(--text)'}}>${price.toFixed(2)}</span>}
              {was>0&&<span style={{fontSize:'12px',color:'var(--td)',textDecoration:'line-through'}}>${was.toFixed(2)}</span>}
              {discountPct>0&&<span style={{background:'rgba(231,76,60,.1)',color:'var(--red)',fontSize:'11px',fontWeight:'700',padding:'2px 7px',borderRadius:'4px'}}>{discountPct}% OFF</span>}
            </div>
            {form.status==='live'&&<div className="ppc-live-badge">🟢 Live · {stockNum>0?`${stockNum} in stock`:'Out of stock'}</div>}
            {form.status==='draft'&&<div style={{marginTop:'4px',display:'inline-flex',alignItems:'center',gap:'4px',padding:'2px 9px',borderRadius:'10px',fontSize:'10px',fontWeight:'700',background:'rgba(201,162,39,.1)',color:'var(--gold)'}}>📝 Draft</div>}
            {form.tags&&<div style={{marginTop:'6px',display:'flex',gap:'4px',flexWrap:'wrap'}}>{form.tags.split(',').map(t=>t.trim()).filter(Boolean).slice(0,4).map(t=><span key={t} style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'2px 8px',fontSize:'10px',color:'var(--tm)'}}>{t}</span>)}</div>}
          </div>
        </div>
      </div>

      {/* ── SUBMIT BUTTON ── */}
      <div className="submit-btn-wrap">
        <button className="apf-submit"
          style={{background:Object.keys(errors).some(k=>errors[k])?'var(--s3)':'linear-gradient(135deg,var(--purple),var(--purple-l))',
            color:Object.keys(errors).some(k=>errors[k])?'var(--td)':'#fff'}}
          onClick={submit}>
          {editId?'💾 Save Changes':'🚀 Publish Listing'}
        </button>
        {Object.keys(errors).filter(k=>errors[k]).length>0&&(
          <div style={{textAlign:'center',marginTop:'8px',fontSize:'12px',color:'var(--red)',fontWeight:'600'}}>
            ⚠️ {Object.keys(errors).filter(k=>errors[k]).length} field{Object.keys(errors).filter(k=>errors[k]).length>1?'s':''} need attention above
          </div>
        )}
        {!editId&&(
          <button onClick={()=>{setF('status','draft');setTimeout(submit,50);}}
            style={{width:'100%',marginTop:'10px',padding:'12px',borderRadius:'12px',
              background:'var(--s2)',border:'1px solid var(--border)',color:'var(--tm)',
              cursor:'pointer',fontSize:'13px',fontWeight:'600',fontFamily:'DM Sans,sans-serif'}}>
            📝 Save as Draft
          </button>
        )}
      </div>
    </div>
  );
}

  const [orders,setOrders]=useState([
    {id:'ORD-9021',buyer:'Amara T.',avatar:'👩🏾',bg:'#1a2a1a',emoji:'⌚',product:'Luxury Chronograph',qty:1,total:220,status:'pending',date:'Today, 09:14 AM'},

    {id:'ORD-8980',buyer:'Tunde B.',avatar:'👨🏾',bg:'#1a2a2a',emoji:'🎧',product:'Bass Pro Headphones',qty:1,total:79,status:'delivered',date:'May 19'},
    {id:'ORD-8961',buyer:'Fatima K.',avatar:'👩🏽',bg:'#2a1a2a',emoji:'⌚',product:'Luxury Chronograph',qty:2,total:440,status:'delivered',date:'May 18'},
  ]);

  /* ── ADD PRODUCT FORM STATE ── */
  const BLANK={name:'',cat:'Luxury',price:'',was:'',desc:'',stock:'',emoji:'⌚',status:'live'};
  const [form,setForm]=useState(BLANK);
  const [formErrors,setFormErrors]=useState({});
  const [addSuccess,setAddSuccess]=useState(false);
  const [editId,setEditId]=useState(null);

  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const validateForm=()=>{
    const e={};
    if(!form.name.trim()) e.name='Product name is required';
    if(!form.price||parseFloat(form.price)<=0) e.price='Enter a valid price';
    if(!form.stock||parseInt(form.stock)<0) e.stock='Enter stock quantity';
    if(!form.desc.trim()) e.desc='Add a short description';
    setFormErrors(e);
    return !Object.keys(e).length;
  };

  const submitProduct=()=>{
    if(!validateForm()) return;
    if(editId){
      setProducts(ps=>ps.map(p=>p.id===editId?{...p,...form,price:parseFloat(form.price),stock:parseInt(form.stock)}:p));
      showToast('Product updated successfully ✅');
      setEditId(null);
    } else {
      const newP={id:Date.now(),emoji:form.emoji,name:form.name,cat:form.cat,
        price:parseFloat(form.price),stock:parseInt(form.stock),
        sold:0,status:form.status,views:0,desc:form.desc,was:parseFloat(form.was)||null};
      setProducts(ps=>[newP,...ps]);
      showToast('Product listed successfully 🎉');
      setAddSuccess(true);
      setTimeout(()=>{setAddSuccess(false);setTab('products');},1800);
    }
    setForm(BLANK);
    setFormErrors({});
  };

  const deleteProduct=(id)=>{
    setProducts(ps=>ps.filter(p=>p.id!==id));
    showToast('Product removed','error');
  };

  const toggleStatus=(id)=>{
    setProducts(ps=>ps.map(p=>{
      if(p.id!==id) return p;
      const next=p.status==='live'?'paused':p.status==='paused'?'live':'live';

                  <div style={{fontSize:'13px',fontWeight:'700'}}>${(p.price*p.sold).toLocaleString()}</div>
                  <div style={{fontSize:'10px',color:'var(--tm)'}}>{p.sold} sold</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════ SHOPPING APP CONTAINER ════════════════════ */
function ShoppingApp({goHome,cart,addToCart,removeFromCart,updateQty,clearCart,wishlist,toggleWishlist,showToast,cartCount,notifications=[],markNotifRead,markAllRead,user}){
  const [page,setPage]=useState('home');
  const [pageData,setPageData]=useState({});
  const [history,setHistory]=useState([]);
  const [searchQ,setSearchQ]=useState('');
  const mainRef=useRef(null);
  const userName=user?.name||'Nelson';

  const nav=(p,data={})=>{
    if(p===-1){const h=[...history];const prev=h.pop();setHistory(h);setPage(prev?.page||'home');setPageData(prev?.data||{});return;}
    setHistory(h=>[...h,{page,data:pageData}]);
    setPage(p); setPageData(data);
    mainRef.current?.scrollTo(0,0);
  };

  const doSearch=(q)=>{
    setSearchQ(q);
    nav('search',{query:q});
  };

  const NAVS=[
    {icon:'🏠',label:'Home',p:'home'},
    {icon:'⊞',label:'Categories',p:'category',data:{cat:'All'}},
    null,
    {icon:'💎',label:'Luxury',p:'category',data:{cat:'Luxury'}},
    {icon:'👗',label:'Fashion',p:'category',data:{cat:'Fashion'}},
    {icon:'💻',label:'Tech',p:'category',data:{cat:'Tech'}},
    {icon:'🍳',label:'Kitchen',p:'category',data:{cat:'Kitchen'}},
    {icon:'🛋',label:'Lifestyle',p:'category',data:{cat:'Lifestyle'}},
    {icon:'⚽',label:'Sports',p:'category',data:{cat:'Sports'}},
    {icon:'💄',label:'Beauty',p:'category',data:{cat:'Beauty'}},
    {icon:'🚗',label:'Automotive',p:'category',data:{cat:'Automotive'}},
    null,
    {icon:'⚡',label:'Deals & Offers',p:'deals',cls:'gld'},
    {icon:'✨',label:'AI Recommendations',p:'ai',cls:'prp'},
    null,
    {icon:'📦',label:'Orders',p:'orders'},
    {icon:'💬',label:'Messages',p:'messages'},
    {icon:'🏪',label:'Sell on NCB',p:'sell'},
    null,
    {icon:'🛡',label:'Security Center',p:'security',cls:'prp'},
  ];

  const renderPage=()=>{
    if(page==='home') return <ShopHome nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist}/>;
    if(page==='product'&&pageData.product) return <ProductDetail product={pageData.product} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist} nav={nav} showToast={showToast}/>;
    if(page==='category') return <CategoryPage cat={pageData.cat||'All'} nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist}/>;
    if(page==='search') return <SearchPage query={pageData.query||searchQ} nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist} onNewSearch={doSearch}/>;
    if(page==='cart') return <CartPage cart={cart} removeFromCart={removeFromCart} updateQty={updateQty} nav={nav} showToast={showToast}/>;
    if(page==='wishlist') return <WishlistPage wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} nav={nav}/>;
    if(page==='ai') return <AIAssistantPage/>;
    if(page==='voice') return <VoiceSearchPage nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist}/>;
    if(page==='image') return <ImageSearchPage nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist}/>;
    if(page==='orders') return <OrdersPage nav={nav}/>;
    if(page==='track') return <OrderTrackingPage nav={nav} orderId={pageData.orderId}/>;
    if(page==='messages') return <MessagesPage/>;
    if(page==='deals') return <DealsPage nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist}/>;
    if(page==='sell')  return <SellerDashboard nav={nav} showToast={showToast}/>;
    if(page==='account')   return <ShopAccountPage nav={nav} user={user} cart={cart} wishlist={wishlist}/>;
    if(page==='security')  return <SecurityCenter nav={nav} user={user}/>;
    if(page==='privacy')   return <PrivacyPage nav={nav}/>;
    if(page==='terms')     return <TermsPage nav={nav}/>;
    if(page==='sec-policy')return <SecurityPolicyPage nav={nav} backTo="account"/>;
    return <ShopHome nav={nav} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist}/>;
  };

  return(
    <div className="shop-wrap">
      {/* TOPBAR */}
      <div className="shop-topbar">

/* ════════════ WALLET: EXCHANGE ════════════ */
function ExchangePage({showToast,requireReAuth}){
  const [from,setFrom]=useState({code:'USD',rate:1});
  const [to,setTo]=useState({code:'NGN',rate:1510});
  const [amt,setAmt]=useState('500');
  const [done,setDone]=useState(false);
  const converted=((parseFloat(amt)||0)*(to.rate/from.rate)).toLocaleString(undefined,{maximumFractionDigits:2});

  const swap=()=>{setFrom(to);setTo(from);};

  if(done) return(
    <div className="success-screen">
      <div style={{fontSize:'72px',animation:'bounceIn .5s ease'}}>⟳</div>
      <div className="success-title">Exchange Complete!</div>
      <div className="success-sub">{amt} {from.code} → {converted} {to.code}</div>
      <button className="action-btn-full" style={{maxWidth:'300px'}} onClick={()=>setDone(false)}>Exchange More</button>
    </div>
  );

  return(
    <div className="exchange-wrap">
      <div style={{fontSize:'16px',fontWeight:'700',marginBottom:'20px'}}>Currency Exchange</div>
      <div className="exchange-card">
        <div className="exc-from">
          <div className="exc-label">You Pay</div>
          <div className="exc-row">
            <input className="exc-input" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="0.00"/>
            <select value={from.code} onChange={e=>{const c=CURRENCIES.find(x=>x.code===e.target.value);setFrom(c||CURRENCIES[0]);}} style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'10px 12px',fontSize:'14px',color:'var(--text)',cursor:'pointer'}}>
              {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code}</option>)}
            </select>
          </div>
        </div>
        <button className="exc-swap-btn" onClick={swap}>⇅</button>
        <div className="exc-to">
          <div className="exc-label">You Receive</div>
          <div className="exc-row">
            <div style={{flex:1,background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px 14px',fontSize:'18px',fontWeight:'700'}}>{converted}</div>
            <select value={to.code} onChange={e=>{const c=CURRENCIES.find(x=>x.code===e.target.value);setTo(c||CURRENCIES[1]);}} style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'10px 12px',fontSize:'14px',color:'var(--text)',cursor:'pointer'}}>
              {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code}</option>)}
            </select>
          </div>
        </div>
      </div>
      <div className="exc-rate-display">
        <div className="exc-rate-num">1 {from.code} = {(to.rate/from.rate).toLocaleString()} {to.code}</div>
        <div className="exc-rate-sub">Live rate · Updated just now · ▲ 0.5% today</div>
      </div>
      <button className="action-btn-full" disabled={!amt||parseFloat(amt)<=0} onClick={()=>{
        if(requireReAuth){
          requireReAuth('🔐 Confirm Exchange',`Zero Trust policy requires verification before converting ${amt} ${from.code} → ${to.code}.`,()=>{setDone(true);showToast('Exchange verified & completed! ⟳');});
        } else { setDone(true);showToast('Exchange completed! ⟳'); }
      }}>Exchange Now</button>
    </div>
  );
}

/* ════════════ WALLET: CHANGE PASSWORD ════════════ */
function ChangePasswordPage({nav,showToast}){
  const [form,setForm]=useState({current:'',newPw:'',confirm:''});
  const [show,setShow]=useState({current:false,newPw:false,confirm:false});
  const [errors,setErrors]=useState({});
  const [done,setDone]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const toggleShow=(k)=>setShow(s=>({...s,[k]:!s[k]}));

  const strength=(pw)=>{
    if(!pw) return{score:0,label:'',color:'var(--border)'};
    let s=0;
    if(pw.length>=8) s++;
    if(/[A-Z]/.test(pw)) s++;
    if(/[0-9]/.test(pw)) s++;
    if(/[^A-Za-z0-9]/.test(pw)) s++;
    const map=[null,{label:'Weak',color:'var(--red)'},{label:'Fair',color:'#f39c12'},{label:'Good',color:' #3498db'},{label:'Strong',color:'var(--green)'}];
    return{score:s,...map[s]};
  };
  const st=strength(form.newPw);

  const validate=()=>{
    const e={};
    if(!form.current) e.current='Enter your current password';
    if(form.newPw.length<8) e.newPw='Password must be at least 8 characters';
    if(form.newPw!==form.confirm) e.confirm='Passwords do not match';
    setErrors(e);
    return !Object.keys(e).length;
  };

  const save=()=>{
    if(!validate()) return;
    setDone(true);
    showToast('Password changed successfully 🔒');
    setTimeout(()=>nav('profile'),1400);
  };

  if(done) return(
    <div className="sub-page" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'340px',gap:'16px',textAlign:'center'}}>
      <div style={{fontSize:'68px',animation:'bounceIn .5s ease'}}>🔒</div>
      <div style={{fontSize:'20px',fontWeight:'700'}}>Password Changed!</div>
      <div style={{fontSize:'13px',color:'var(--tm)'}}>Your password has been updated successfully.</div>
    </div>
  );

  return(
    <div className="sub-page">
      <button className="sub-page-back" onClick={()=>nav('profile')}>← Back to Profile</button>
      <div className="sub-page-title">Change Password</div>
      <div className="sub-page-sub">Choose a strong password to keep your account safe</div>
      <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
        <div>
          <div className="form-label">Current Password</div>
          <div className="pass-wrap">
            <input className={`form-input ${errors.current?'error':''}`} type={show.current?'text':'password'} value={form.current} onChange={e=>set('current',e.target.value)} placeholder="Enter current password"/>
            <span className="pass-eye" onClick={()=>toggleShow('current')}>{show.current?'🙈':'👁'}</span>
          </div>
          {errors.current&&<div className="form-error">{errors.current}</div>}
        </div>
        <div>
          <div className="form-label">New Password</div>
          <div className="pass-wrap">
            <input className={`form-input ${errors.newPw?'error':''}`} type={show.newPw?'text':'password'} value={form.newPw} onChange={e=>set('newPw',e.target.value)} placeholder="At least 8 characters"/>
            <span className="pass-eye" onClick={()=>toggleShow('newPw')}>{show.newPw?'🙈':'👁'}</span>
          </div>
          {form.newPw&&(
            <div className="pw-strength">
              <div className="pw-strength-bar" style={{width:`${st.score*25}%`,background:st.color,marginTop:'6px'}}/>
              <div className="pw-strength-label" style={{color:st.color,marginTop:'4px',fontSize:'11px'}}>{st.label}</div>
            </div>
          )}
          {errors.newPw&&<div className="form-error">{errors.newPw}</div>}
        </div>
        <div>
          <div className="form-label">Confirm New Password</div>
          <div className="pass-wrap">
            <input className={`form-input ${errors.confirm?'error':''}`} type={show.confirm?'text':'password'} value={form.confirm} onChange={e=>set('confirm',e.target.value)} placeholder="Re-enter new password"/>
            <span className="pass-eye" onClick={()=>toggleShow('confirm')}>{show.confirm?'🙈':'👁'}</span>
          </div>
          {errors.confirm&&<div className="form-error">{errors.confirm}</div>}
          {form.confirm&&form.newPw===form.confirm&&<div style={{fontSize:'11px',color:'var(--green)',marginTop:'4px'}}>✅ Passwords match</div>}
        </div>
        <div style={{background:'var(--s1)',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px 14px'}}>
          {['At least 8 characters','One uppercase letter (A–Z)','One number (0–9)','One special character (!@#…)'].map((tip,i)=>{
            const checks=[form.newPw.length>=8,/[A-Z]/.test(form.newPw),/[0-9]/.test(form.newPw),/[^A-Za-z0-9]/.test(form.newPw)];
            return <div key={i} style={{fontSize:'12px',color:checks[i]?'var(--green)':'var(--tm)',marginBottom:'4px',display:'flex',alignItems:'center',gap:'7px'}}><span>{checks[i]?'✅':'○'}</span>{tip}</div>;
          })}
        </div>
        <button className="action-btn-full" onClick={save}>Update Password</button>
      </div>
    </div>
  );
}

/* ════════ PERSISTENCE HOOK ════════ */
function usePersist(key,def){
  const [v,sv]=useState(()=>{
    try{const s=localStorage.getItem(key);return s!==null?JSON.parse(s):def;}
    catch{return def;}
  });
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v));}catch{}},[v,key]);
  return[v,sv];
}

function IOSPrompt(){

  const confirmReAuth=()=>{reAuthAction?.action();setReAuthAction(null);};

  const renderPage=()=>{

    if(page==='send')            return <SendMoneyPage showToast={showToast} user={user} requireReAuth={requireReAuth}/>;
    if(page==='receive')         return <ReceivePage showToast={showToast}/>;
    if(page==='add')             return <AddMoneyPage showToast={showToast} requireReAuth={requireReAuth}/>;
    if(page==='exchange')        return <ExchangePage showToast={showToast} requireReAuth={requireReAuth}/>;
    if(page==='cards')           return <CardsPage showToast={showToast}/>;
    if(page==='transactions')    return <TransactionsPage/>;

  const [pendingUser,setPendingUser]=useState(null);
  const [form,setForm]=useState({firstName:'',lastName:'',email:'',phone:'',password:'',confirm:'',terms:false});
  const [errors,setErrors]=useState({});
  const [loading,setLoading]=useState(false);
  const [showPw,setShowPw]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const validate=()=>{
    const e={};
    if(!form.email.includes('@')) e.email='Enter a valid email address';
    if(form.password.length<6) e.password='Password must be at least 6 characters';
    if(mode==='register'){
      if(!form.firstName.trim()) e.firstName='First name is required';
      if(!form.lastName.trim()) e.lastName='Last name is required';
      if(form.password!==form.confirm) e.confirm='Passwords do not match';
      if(!form.terms) e.terms='Please accept the terms to continue';
    }
    setErrors(e);
    return !Object.keys(e).length;
  };

  const submit=()=>{
    if(!validate()) return;
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      const u={name:mode==='register'?form.firstName:'Nelson',email:form.email,mode};
      setPendingUser(u);
      setStep('mfa'); // ← always go through MFA

  const [showLegal,setShowLegal]=useState(null); // 'terms'|'privacy'|'security'|null
