/* ════════════════════ NOTIFICATION BELL ════════════════════ */
function NotificationBell({notifications,markRead,markAllRead}){
  const [open,setOpen]=useState(false);
  const unread=notifications.filter(n=>!n.read).length;
  const ref=useRef(null);

  useEffect(()=>{
    const h=(e)=>{if(ref.current&&!ref.current.contains(e.target)) setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);

  const ICON_COLORS={order:'rgba(124,92,191,.12)',shipped:'rgba(52,152,219,.12)',
    delivered:'rgba(22,163,74,.12)',sold:'rgba(184,144,15,.12)',payment:'rgba(22,163,74,.12)',promo:'rgba(231,76,60,.12)'};

  return(
    <div className="notif-bell-wrap" ref={ref}>
      <button className="notif-bell-btn" onClick={()=>setOpen(o=>!o)}>
        🔔
        {unread>0&&<span className="notif-badge">{unread>9?'9+':unread}</span>}
      </button>
      {open&&(
        <div className="notif-panel">
          <div className="np-header">
            <span className="np-title">Notifications {unread>0&&<span style={{fontSize:'12px',color:'var(--tm)',fontWeight:'400'}}>({unread} new)</span>}</span>
            {unread>0&&<button className="np-mark-all" onClick={markAllRead}>Mark all read</button>}
          </div>
          <div className="np-list">
            {notifications.length===0?(
              <div className="np-empty">🔔 No notifications yet</div>
            ):notifications.map(n=>(
              <div key={n.id} className={`np-item ${!n.read?'unread':''}`} onClick={()=>markRead(n.id)}>
                <div className="np-icon" style={{background:ICON_COLORS[n.type]||'var(--s2)'}}>{n.icon}</div>
                <div className="np-body">
                  <div className="np-item-title">{n.title}</div>
                  <div className="np-item-msg">{n.msg}</div>
                  <div className="np-item-time">{n.time}</div>
                </div>
                {!n.read&&<div style={{width:'8px',height:'8px',borderRadius:'50%',background:'var(--purple)',flexShrink:0,marginTop:'4px'}}/>}
              </div>
            ))}
          </div>
          <div className="np-footer">
            <button className="np-view-all" onClick={()=>setOpen(false)}>View all notifications</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── ZT Trust Badge (shown in topbars) ── */
function ZTBadge({score=100,onClick}){
  const level = score>=90?'trusted':score>=70?'warning':'danger';
  const label = score>=90?'🔐 Protected':score>=70?'⚠️ Review':'🚨 At Risk';
  return <div className={`zt-badge ${level}`} onClick={onClick}>{label}</div>;
}

/* ── Zero Trust MFA Screen ── */
function ZeroTrustMFA({user,onVerified,onBack}){
  const [digits,setDigits]=useState(['','','','','','']);
  const [error,setError]=useState('');
  const [attempts,setAttempts]=useState(0);
  const [trustDevice,setTrustDevice]=useState(false);
  const [timer,setTimer]=useState(30);
  const [verifying,setVerifying]=useState(false);
  const [success,setSuccess]=useState(false);
  const [method,setMethod]=useState('otp'); // 'otp' | 'biometric'
  const inputRefs=useRef([]);
  const DEMO_CODE='284710';
  const MAX_ATTEMPTS=3;

  useEffect(()=>{
    const t=setInterval(()=>setTimer(s=>s>0?s-1:0),1000);
    return()=>clearInterval(t);
  },[]);

  const resend=()=>{setTimer(30);setDigits(['','','','','','']);setError('');inputRefs.current[0]?.focus();};

  const handleDigit=(idx,val)=>{
    if(!/^\d?$/.test(val)) return;
    const next=[...digits];
    next[idx]=val;
    setDigits(next);
    setError('');
    if(val&&idx<5) inputRefs.current[idx+1]?.focus();
    if(!val&&idx>0) inputRefs.current[idx-1]?.focus();
  };

  const handleKeyDown=(idx,e)=>{
    if(e.key==='Backspace'&&!digits[idx]&&idx>0) inputRefs.current[idx-1]?.focus();
    if(e.key==='ArrowLeft'&&idx>0) inputRefs.current[idx-1]?.focus();
    if(e.key==='ArrowRight'&&idx<5) inputRefs.current[idx+1]?.focus();
  };

  const verify=()=>{
    const code=digits.join('');
    if(code.length<6){setError('Please enter the full 6-digit code.');return;}
    setVerifying(true);
    setTimeout(()=>{
      setVerifying(false);
      // Accept demo code or any 6 digits for demo purposes
      if(code===DEMO_CODE||code.length===6){
        setSuccess(true);
        setTimeout(()=>onVerified({trustDevice}),1200);
      } else {
        const newAttempts=attempts+1;
        setAttempts(newAttempts);
        if(newAttempts>=MAX_ATTEMPTS){setError('Too many failed attempts. Account temporarily locked.');}
        else{setError(`Invalid code. ${MAX_ATTEMPTS-newAttempts} attempt${MAX_ATTEMPTS-newAttempts!==1?'s':''} remaining.`);}
        setDigits(['','','','','','']);
        inputRefs.current[0]?.focus();
      }
    },1400);
  };

  const biometricVerify=()=>{
    setMethod('biometric');
    setVerifying(true);
    setTimeout(()=>{setVerifying(false);setSuccess(true);setTimeout(()=>onVerified({trustDevice}),1200);},2000);
  };

  const initials=(user?.name||'N').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const maskedEmail=(user?.email||'n***@***.com').replace(/(.{2}).*(@)/,'$1***$2');

  return(
    <div className="mfa-stage">
      <div className="mfa-card">
        {/* Header */}
        <div style={{textAlign:'center',marginBottom:'24px'}}>
          <div className="mfa-icon-wrap" style={{margin:'0 auto 16px',background:'linear-gradient(135deg,#1a0a3a,#3a2a7a)'}}>
            {success?'✅':verifying&&method==='biometric'?'🫆':'🔐'}
          </div>
          <div className="mfa-title">{success?'Identity Verified!':verifying&&method==='biometric'?'Scanning…':'Two-Factor Verification'}</div>
          <div className="mfa-sub">
            {success?'Zero Trust authentication complete. Establishing secure session…'
            :verifying&&method==='biometric'?'Verifying your biometric signature…'
            :`Zero Trust requires identity verification.\nA 6-digit code was sent to ${maskedEmail}`}
          </div>
        </div>

        {/* Zero Trust Policy notice */}
        {!success&&<div className="zt-policy-bar">🛡 Zero Trust Policy — All sessions require explicit verification</div>}

        {/* OTP Input */}
        {!success&&method==='otp'&&!verifying&&(
          <>
            <div style={{display:'flex',gap:'8px',justifyContent:'center',marginBottom:'14px'}}>
              {digits.map((d,i)=>(
                <input key={i} ref={el=>inputRefs.current[i]=el}
                  className="pin-box" type="tel" inputMode="numeric"
                  maxLength={1} value={d}
                  onChange={e=>handleDigit(i,e.target.value)}
                  onKeyDown={e=>handleKeyDown(i,e)}
                  style={{width:'46px',height:'54px',fontSize:'22px',
                    borderColor:d?'var(--purple)':error?'var(--red)':'var(--border)',
                    background:d?'rgba(124,92,191,.06)':'var(--s2)'}}/>
              ))}
            </div>
            {error&&<div style={{color:'var(--red)',fontSize:'12px',textAlign:'center',marginBottom:'10px'}}>{error}</div>}
            <div className="mfa-hint">Demo code: <strong style={{letterSpacing:'3px',color:'var(--purple)'}}>{DEMO_CODE}</strong></div>
            <div className="mfa-timer">
              {timer>0?<span>Resend code in <strong>{timer}s</strong></span>:<button className="mfa-resend" onClick={resend}>Resend Code</button>}
            </div>
            <div className="mfa-attempts">
              {Array.from({length:MAX_ATTEMPTS}).map((_,i)=>(
                <div key={i} className={`mfa-attempt-dot ${i<attempts?'used':''}`}/>
              ))}
            </div>
          </>
        )}

        {/* Verifying spinner */}
        {verifying&&method==='otp'&&(
          <div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{fontSize:'36px',animation:'spin 1s linear infinite',display:'inline-block'}}>⚙️</div>
            <div style={{color:'var(--tm)',fontSize:'13px',marginTop:'12px'}}>Verifying identity…</div>
          </div>
        )}

        {/* Success */}
        {success&&(
          <div style={{textAlign:'center',padding:'10px 0'}}>
            <div style={{fontSize:'13px',color:'var(--green)',fontWeight:'600'}}>
              🔒 Encrypted session established<br/>🌍 Access granted from verified device
            </div>
          </div>
        )}

        {/* Buttons */}
        {!success&&!verifying&&(
          <>
            <button className="tg-verify-btn active" style={{marginBottom:'10px'}}
              onClick={verify} disabled={digits.join('').length<6||attempts>=MAX_ATTEMPTS}>
              {verifying?'Verifying…':'Verify Identity →'}
            </button>
            <button className="biometric-btn" onClick={biometricVerify}>
              <span style={{fontSize:'20px'}}>🫆</span> Use Biometric Authentication
            </button>
            <div style={{display:'flex',alignItems:'center',gap:'10px',
              padding:'12px 14px',background:'var(--s2)',borderRadius:'10px',marginBottom:'14px'}}>
              <div className={`toggle ${trustDevice?'on':''}`} onClick={()=>setTrustDevice(t=>!t)} style={{flexShrink:0}}>
                <div className="toggle-thumb"/>
              </div>
              <div>
                <div style={{fontSize:'12.5px',fontWeight:'600'}}>Trust this device for 30 days</div>
                <div style={{fontSize:'11px',color:'var(--tm)'}}>Skip MFA on future logins from this device</div>
              </div>
            </div>
            <button className="tg-cancel-btn" onClick={onBack}>← Back to Login</button>
          </>
        )}

        {/* User info */}
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginTop:'20px',
          padding:'10px 14px',background:'var(--s2)',borderRadius:'10px',
          fontSize:'12px',color:'var(--tm)'}}>
          <div style={{width:'28px',height:'28px',borderRadius:'50%',
            background:'linear-gradient(135deg,var(--purple),var(--purple-l))',
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:'11px',fontWeight:'800',color:'#fff',flexShrink:0}}>{initials}</div>
          <div>Signing in as <strong style={{color:'var(--text)'}}>{user?.name||'User'}</strong></div>
          <span className="enc-badge" style={{marginLeft:'auto'}}>🔒 TLS 1.3</span>
        </div>
      </div>
    </div>
  );
}

/* ── Transaction Guard (wraps high-value wallet actions) ── */
function TransactionGuard({amount,recipient,onApproved,onCancel}){
  const [mode,setMode]=useState('choice'); // 'choice'|'pin'|'biometric'|'success'|'denied'
  const [pin,setPin]=useState(['','','','']);
  const [pinError,setPinError]=useState('');
  const pinRefs=useRef([]);
  const DEMO_PIN='1234';

  const handlePin=(i,v)=>{
    if(!/^\d?$/.test(v)) return;
    const next=[...pin]; next[i]=v; setPin(next); setPinError('');
    if(v&&i<3) pinRefs.current[i+1]?.focus();
    if(!v&&i>0) pinRefs.current[i-1]?.focus();
  };

  const verifyPin=()=>{
    const entered=pin.join('');
    if(entered===DEMO_PIN||entered.length===4){
      setMode('success');
      setTimeout(()=>onApproved(),1200);
    } else {
      setPinError('Incorrect PIN. Demo PIN is 1234.');
      setPin(['','','','']);
      pinRefs.current[0]?.focus();
    }
  };

  const biometric=()=>{
    setMode('biometric');
    setTimeout(()=>{setMode('success');setTimeout(()=>onApproved(),1000);},2000);
  };

  return(
    <div className="tg-overlay">
      <div className="tg-card">
        {mode==='choice'&&<>
          <div className="tg-icon">🛡</div>
          <div className="tg-title">Transaction Verification</div>
          <div className="tg-sub">Zero Trust policy requires re-authentication for high-value transfers</div>
          <div className="tg-amount-box">
            <div className="tg-amount-val">${parseFloat(amount).toFixed(2)}</div>
            <div className="tg-amount-lbl">to {recipient}</div>
          </div>
          <div className="zt-policy-bar" style={{justifyContent:'center'}}>🔐 Amount exceeds $200 threshold</div>
          <button className="tg-verify-btn active" onClick={()=>{setMode('pin');setTimeout(()=>pinRefs.current[0]?.focus(),100);}}>🔢 Enter PIN</button>
          <button className="biometric-btn" onClick={biometric}><span style={{fontSize:'20px'}}>🫆</span>Biometric Verify</button>
          <button className="tg-cancel-btn" onClick={onCancel}>Cancel Transaction</button>
        </>}

        {mode==='pin'&&<>
          <div className="tg-icon">🔢</div>
          <div className="tg-title">Enter Your PIN</div>
          <div className="tg-sub">4-digit transaction PIN<br/><span style={{color:'var(--gold)',fontSize:'12px'}}>Demo PIN: 1234</span></div>
          <div className="pin-row">
            {pin.map((d,i)=>(
              <input key={i} ref={el=>pinRefs.current[i]=el}
                className="pin-box" type="password" inputMode="numeric"
                maxLength={1} value={d}
                onChange={e=>handlePin(i,e.target.value)}
                onKeyDown={e=>{if(e.key==='Backspace'&&!d&&i>0)pinRefs.current[i-1]?.focus();if(e.key==='Enter'&&pin.join('').length===4)verifyPin();}}/>
            ))}
          </div>
          {pinError&&<div style={{color:'var(--red)',fontSize:'12px',marginBottom:'12px'}}>{pinError}</div>}
          <button className="tg-verify-btn active" onClick={verifyPin} disabled={pin.join('').length<4}>Confirm</button>
          <button className="biometric-btn" onClick={biometric}><span>🫆</span>Use Biometric Instead</button>
          <button className="tg-cancel-btn" onClick={()=>setMode('choice')}>← Back</button>
        </>}

        {mode==='biometric'&&<>
          <div className="tg-icon" style={{animation:'pulse 1s ease-in-out infinite'}}>🫆</div>
          <div className="tg-title">Biometric Scan</div>
          <div className="tg-sub">Place your finger on the sensor or look at the camera</div>
          <div style={{fontSize:'12px',color:'var(--tm)',marginTop:'10px'}}>Scanning… please hold still</div>
        </>}

        {mode==='success'&&<>
          <div className="tg-icon">✅</div>
          <div className="tg-title">Identity Verified!</div>
          <div className="tg-sub" style={{color:'var(--green)'}}>Transaction approved under Zero Trust policy.<br/>Processing transfer…</div>
        </>}
      </div>
    </div>
  );
}

function ReAuthModal({title,subtitle,onConfirm,onCancel}){
  const [pin,setPin]=useState('');
  const [err,setErr]=useState('');
  const [checking,setChecking]=useState(false);
  const CORRECT='1234'; // demo PIN

  const confirm=()=>{

    setChecking(true);

  return(
    <div className="re-auth-overlay" onClick={e=>e.target===e.currentTarget&&onCancel()}>

          {[0,1,2,3].map(i=>(

/* ════════════ SESSION LOCK HOOK ════════════ */
function useSessionLock(active,timeoutMs=600000){ // 10 min default
  const [locked,setLocked]=useState(false);
  const timer=useRef(null);

  const resetTimer=useCallback(()=>{
    if(!active) return;
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>setLocked(true),timeoutMs);
  },[active,timeoutMs]);

  useEffect(()=>{
    if(!active){setLocked(false);return;}
    const events=['mousemove','keydown','click','touchstart','scroll'];
    events.forEach(e=>document.addEventListener(e,resetTimer,{passive:true}));
    resetTimer();
    return()=>{events.forEach(e=>document.removeEventListener(e,resetTimer));clearTimeout(timer.current);};
  },[active,resetTimer]);

  return [locked,()=>setLocked(false)];
}

/* ════════════════════ ROOT APP ════════════════════ */
/* ════════════════════ ROOT APP ════════════════════ */
function App(){
  /* ── Restore from localStorage (persistence) ── */
  const load=(key,fallback)=>{try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch{return fallback;}};
  const save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val));}catch{}};

  const [screen,setScreen]       = useState(()=>load('nls_screen','auth'));
  const [user,setUser]           = useState(()=>load('nls_user',null));
  const [cart,setCart]           = useState(()=>load('nls_cart',[]));
  const [wishlist,setWishlist]   = useState(()=>new Set(load('nls_wish',[])));
  const [orders,setOrders]       = useState(()=>load('nls_orders',ORDERS));
  const [sellerProds,setSellerP] = useState(()=>load('nls_seller',[]));
  const [notifications,setNotif] = useState(()=>load('nls_notif',[
    {id:1,type:'delivered',icon:'✅',title:'Order Delivered!',msg:'Your Luxury Watch (ORD-8821) has been delivered.',time:'2 min ago',read:false},
    {id:2,type:'shipped',icon:'🚚',title:'Order Shipped',msg:'Your Nike Air Max (ORD-8654) is on the way. ETA: May 24.',time:'3 hours ago',read:false},
    {id:3,type:'sold',icon:'💰',title:'Product Sold!',msg:'Someone just bought your Urban Runner Shoes.',time:'5 hours ago',read:false},
    {id:4,type:'payment',icon:'💳',title:'Payment Received',msg:'$250.00 from James has been added to your wallet.',time:'Today, 9:12 AM',read:true},
    {id:5,type:'promo',icon:'🔥',title:'Flash Sale Live!',msg:'Up to 40% off on selected Tech products today only.',time:'Yesterday',read:true},
    {id:6,type:'order',icon:'🛍',title:'Order Placed',msg:'Your order ORD-8390 has been placed successfully.',time:'Apr 28',read:true},
  ]));
  const [toast,setToast] = useState(null);
  const toastTimer = useRef(null);

  /* ── Persist every state change ── */
  useEffect(()=>save('nls_screen',screen),           [screen]);
  useEffect(()=>save('nls_user',user),               [user]);
  useEffect(()=>save('nls_cart',cart),               [cart]);
  useEffect(()=>save('nls_wish',[...wishlist]),       [wishlist]);
  useEffect(()=>save('nls_orders',orders),           [orders]);
  useEffect(()=>save('nls_seller',sellerProds),      [sellerProds]);
  useEffect(()=>save('nls_notif',notifications),     [notifications]);

  /* ── allProducts = base catalogue + live seller listings ── */
  const allProducts = useMemo(()=>[
    ...PRODUCTS,
    ...sellerProds
      .filter(p=>p.status==='live')
      .map(p=>({...p, id:`sp-${p.id}`, fromSeller:true}))
  ],[sellerProds]);

  /* ── Helpers ── */
  const showToast=(msg,type='success')=>{
    if(toastTimer.current) clearTimeout(toastTimer.current);
    setToast({msg,type});
    toastTimer.current=setTimeout(()=>setToast(null),3200);
  };

  const pushNotif=(n)=>setNotif(ns=>[{...n,id:Date.now(),time:'Just now',read:false},...ns].slice(0,50));

  const addToCart=(product)=>{
    setCart(prev=>{
      const ex=prev.find(i=>i.id===product.id);
      return ex?prev.map(i=>i.id===product.id?{...i,qty:i.qty+1}:i):[...prev,{...product,qty:1}];
    });
    pushNotif({type:'cart',icon:'🛒',title:'Added to Cart',msg:`${product.name} added to your cart.`});
    showToast(`${product.name} added to cart 🛒`);
  };

  const removeFromCart=(id)=>setCart(p=>p.filter(i=>i.id!==id));
  const updateQty=(id,qty)=>{ if(qty<1)return removeFromCart(id); setCart(p=>p.map(i=>i.id===id?{...i,qty}:i)); };
  const clearCart=()=>setCart([]);

  const addOrder=(cartItems,total)=>{
    const id=`ORD-${9000+orders.length+1}`;
    const newOrder={
      id, date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
      status:'Processing', total,
      items:cartItems.map(i=>({emoji:i.emoji,name:i.name})),
    };
    setOrders(os=>[newOrder,...os]);
    pushNotif({type:'order',icon:'🛍',title:'Order Placed!',msg:`Order ${id} is confirmed. Estimated delivery: 3-5 days.`});
    showToast(`Order ${id} placed! 🎉`);
    return id;
  };

  const toggleWishlist=(product)=>{
    setWishlist(prev=>{
      const next=new Set(prev);
      if(next.has(product.id)){next.delete(product.id);showToast('Removed from wishlist','info');}
      else{next.add(product.id);showToast(`${product.name} saved ♥`);}
      return next;
    });
  };

  const markNotifRead  =(id)=>setNotif(ns=>ns.map(n=>n.id===id?{...n,read:true}:n));
  const markAllRead    =()=>setNotif(ns=>ns.map(n=>({...n,read:true})));
  const cartCount      = cart.reduce((s,i)=>s+i.qty,0);

  const handleAuth=(userData)=>{
    setUser(userData);
    setScreen('flip');
    showToast(`Welcome${userData.mode==='register'?' to NELSON':' back'}, ${userData.name}! 👋`);
    if(userData.mode==='register')
      pushNotif({type:'welcome',icon:'🎉',title:'Welcome to NELSON!',msg:`Hi ${userData.name}! Your account is ready. Start shopping or list your first product.`});
  };

  const logout=()=>{ setUser(null); setScreen('auth'); setCart([]); setWishlist(new Set()); showToast('Logged out successfully'); };

  /* ── Shared context value ── */
  const appCtxVal = useMemo(()=>({
    orders, addOrder, user, sellerProds, setSellerP,
    pushNotif, logout,
  }),[orders, user, sellerProds]);

  const [locked,unlockSession]=useSessionLock(screen!=='auth',600000);

  return(
    <ProductsCtx.Provider value={allProducts}>
    <AppCtx.Provider value={appCtxVal}>
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column'}}>
      {/* SESSION LOCK */}
      {locked&&screen!=='auth'&&<LockScreen user={user} onUnlock={unlockSession}/>}

      {screen==='auth'    && <AuthScreen onAuth={handleAuth}/>}
      {screen==='flip'    && <FlipLanding goShopping={()=>setScreen('shopping')} goWallet={()=>setScreen('wallet')} user={user}/>}
      {screen==='shopping'&& <ShoppingApp
          goHome={()=>setScreen('flip')}
          cart={cart} addToCart={addToCart} removeFromCart={removeFromCart}
          updateQty={updateQty} clearCart={clearCart}
          wishlist={wishlist} toggleWishlist={toggleWishlist}
          showToast={showToast} cartCount={cartCount}
          notifications={notifications} markNotifRead={markNotifRead} markAllRead={markAllRead}
          user={user}/>}
      {screen==='wallet'  && <WalletApp goHome={()=>setScreen('flip')} showToast={showToast} user={user}/>}
      <Toast toast={toast}/>
      <IOSPrompt/>
    </div>
    </AppCtx.Provider>
    </ProductsCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
