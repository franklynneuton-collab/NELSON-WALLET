<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nelson × Potafoglio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f8;--s1:#ffffff;--s2:#f0f0f7;--s3:#e6e6f2;--s4:#d8d8ea;
--gold:#b8900f;--gold-l:#d4a820;--purple:#7c5cbf;--purple-l:#6b4aad;
--text:#1a1a2e;--tm:#64748b;--td:#94a3b8;--green:#16a34a;--red:#dc2626;
--border:rgba(0,0,0,0.09);--r:12px;--rs:8px;
--shadow:0 2px 12px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}
#root{width:100%;height:100%;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px;}
input,textarea,select{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--s2);}
input:focus,textarea:focus{outline:none;}
button{cursor:pointer;font-family:'DM Sans',sans-serif;}
/* FLIP LANDING */
.flip-stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(145deg,#f0eaff 0%,#faf8ff 40%,#fff9ec 100%);position:relative;overflow:hidden;}
.flip-glow-l{position:absolute;left:-5%;top:10%;width:500px;height:500px;border-radius:50%;
background:rgba(124,92,191,.08);filter:blur(80px);pointer-events:none;}
.flip-glow-r{position:absolute;right:-5%;top:10%;width:500px;height:500px;border-radius:50%;
background:rgba(184,144,15,.07);filter:blur(80px);pointer-events:none;}
.flip-header{position:absolute;top:20px;left:50%;transform:translateX(-50%);
display:flex;align-items:center;gap:16px;z-index:10;}
.flip-chip{padding:7px 18px;border-radius:20px;font-size:11.5px;font-weight:700;
letter-spacing:.4px;cursor:pointer;transition:.25s;border:1px solid transparent;white-space:nowrap;}
.fc-purple{background:rgba(124,92,191,.15);border-color:#7c5cbf44;color:var(--purple-l);}
.fc-gold{background:rgba(201,162,39,.12);border-color:#c9a22740;color:var(--gold);}
.fc-sep{width:1px;height:22px;background:var(--border);}
.book-wrap{perspective:2400px;width:900px;height:560px;position:relative;}
.book{width:100%;height:100%;position:relative;transform-style:preserve-3d;}
.bk-page{position:absolute;top:0;width:50%;height:100%;overflow:hidden;}
.bk-left{left:0;border-radius:14px 0 0 14px;background:var(--s1);}
.bk-right{right:0;border-radius:0 14px 14px 0;background:var(--s1);}
.bk-leaf{position:absolute;top:0;left:50%;width:50%;height:100%;
transform-origin:left center;transform-style:preserve-3d;
transition:transform 1.05s cubic-bezier(.645,.045,.355,1);z-index:20;}
.bk-leaf.flipped{transform:rotateY(-180deg);}
.bk-lf,.bk-lb{position:absolute;top:0;left:0;width:100%;height:100%;
backface-visibility:hidden;overflow:hidden;}
.bk-lb{transform:rotateY(180deg);}
.bk-spine{position:absolute;top:0;left:50%;transform:translateX(-50%);width:8px;height:100%;
background:linear-gradient(to right,rgba(0,0,0,.6),rgba(0,0,0,.1),rgba(0,0,0,.6));
z-index:25;pointer-events:none;}
.book-shadow{position:absolute;bottom:-28px;left:8%;width:84%;height:28px;
background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);pointer-events:none;}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;
border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--border);
display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;
transition:.2s;z-index:30;user-select:none;}
.nav-arrow:hover{background:rgba(255,255,255,.1);}
.nav-arrow.lft{left:calc(50% - 510px);}
.nav-arrow.rgt{right:calc(50% - 510px);}
.dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
display:flex;gap:10px;z-index:30;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:.3s;}
.dot.dp{background:var(--purple-l);}
.dot.dg{background:var(--gold);}
.flip-enter{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
display:flex;gap:14px;z-index:30;}
.enter-btn{padding:12px 28px;border-radius:30px;font-size:13px;font-weight:700;
cursor:pointer;transition:.25s;border:1px solid transparent;white-space:nowrap;}
.eb-purple{background:var(--purple);color:#fff;border-color:var(--purple);}
.eb-purple:hover{background:var(--purple-l);}
.eb-gold{background:var(--gold);color:#000;border-color:var(--gold);}
.eb-gold:hover{background:var(--gold-l);}
/* MINI PREVIEW PAGES (book faces) */
.mini-shopping{width:100%;height:100%;background:linear-gradient(160deg,#0e0e18,#13131e);
display:flex;flex-direction:column;overflow:hidden;}
.mn-topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;
background:rgba(20,20,23,.97);border-bottom:1px solid var(--border);flex-shrink:0;}
.mn-logo-b{width:18px;height:18px;background:var(--gold);border-radius:3px;
display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#000;}
.mn-logo-t{font-size:9px;font-weight:700;}
.mn-search{flex:1;max-width:180px;background:#1a1a22;border:1px solid var(--border);
border-radius:20px;padding:3px 9px;font-size:8.5px;color:var(--tm);}
.mn-actions{display:flex;gap:3px;margin-left:auto;}
.mn-btn{font-size:7.5px;background:#1a1a22;border:1px solid var(--border);border-radius:10px;
padding:2.5px 6px;color:var(--tm);}
.mn-btn-ai{background:linear-gradient(135deg,#3a2a7a,#5a3db5);color:#c8b4ff;border-color:#7c5cbf44;}
.mn-body{display:flex;flex:1;overflow:hidden;}
.mn-sidebar{width:68px;background:rgba(12,12,18,.9);border-right:1px solid var(--border);
padding:5px 0;flex-shrink:0;}
.mn-nav{display:flex;flex-direction:column;gap:1px;}
.mn-ni{padding:4px 8px;font-size:7.5px;color:var(--tm);display:flex;align-items:center;gap:3px;}
.mn-ni.a{color:var(--text);border-left:2px solid var(--gold);}
.mn-ni.g{color:var(--gold-l);}
.mn-main{flex:1;padding:7px;overflow:hidden;display:flex;flex-direction:column;gap:5px;}
.mn-hero{border-radius:7px;background:linear-gradient(135deg,#0a0a10,#151220);
border:1px solid var(--border);padding:9px 11px;display:flex;align-items:center;
justify-content:space-between;flex-shrink:0;}
.mn-ht{font-size:10px;font-weight:700;line-height:1.2;}
.mn-ht span{color:var(--gold);}
.mn-hb{font-size:6.5px;background:var(--gold);color:#000;padding:2.5px 8px;
border-radius:8px;font-weight:700;margin-top:4px;display:inline-block;}
.mn-icons{font-size:20px;}
.mn-feats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex-shrink:0;}
.mn-feat{background:#1a1a22;border:1px solid var(--border);border-radius:4px;
padding:4px 5px;font-size:7px;display:flex;align-items:center;gap:3px;}
.mn-cats{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
.mn-cat{background:#1a1a22;border:1px solid var(--border);border-radius:4px;
text-align:center;font-size:14px;padding:4px 0 2px;}
.mn-cat-l{font-size:6px;color:var(--tm);padding:2px 0;}
.mn-deals{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.mn-deal{background:#1a1a22;border:1px solid var(--border);border-radius:4px;
padding:4px;text-align:center;}
.mn-deal-i{font-size:18px;}
.mn-deal-n{font-size:6.5px;font-weight:600;}
.mn-deal-p{font-size:7.5px;color:var(--gold);}
.mn-deal-b{font-size:6px;color:var(--red);}
.mini-wallet{width:100%;height:100%;display:flex;overflow:hidden;}
.mini-pot{flex:1;display:flex;flex-direction:column;overflow:hidden;
background:#0f0f18;border-right:1px solid var(--border);}
.mini-pot:last-child{border-right:none;}
.mp-status{display:flex;justify-content:space-between;padding:4px 11px;
background:#0b0b12;font-size:8.5px;color:var(--tm);}
.mp-hdr{display:flex;align-items:center;justify-content:space-between;
padding:8px 12px 6px;border-bottom:1px solid var(--border);}
.mp-title{font-size:12px;font-weight:700;text-align:center;flex:1;}
.mp-ico{font-size:13px;color:var(--tm);}
.mp-bal{padding:10px 12px 8px;}
.mp-bal-l{font-size:9px;color:var(--tm);margin-bottom:2px;}
.mp-bal-a{font-size:20px;font-weight:800;}
.mp-bal-c{font-size:10px;color:var(--tm);}
.mp-bal-g{font-size:9.5px;color:var(--green);margin-top:2px;}
.mp-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 12px;}
.mp-act{display:flex;flex-direction:column;align-items:center;gap:3px;}
.mp-act-i{width:34px;height:34px;border-radius:50%;
background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.3);
display:flex;align-items:center;justify-content:center;font-size:13px;}
.mp-act-l{font-size:7.5px;color:var(--tm);}
.mp-card{margin:0 12px;border-radius:9px;padding:11px 13px;
background:linear-gradient(135deg,#1a1508,#2a2010,#1a1508);
border:1px solid rgba(201,162,39,.25);position:relative;overflow:hidden;}
.mp-card::before{content:'';position:absolute;inset:0;
background:radial-gradient(ellipse at 80% 20%,rgba(201,162,39,.12),transparent 60%);}
.mp-card-brand{font-size:8px;font-weight:800;letter-spacing:2.5px;color:var(--gold);margin-bottom:6px;}
.mp-card-num{font-size:9px;letter-spacing:1.5px;font-family:monospace;margin-bottom:5px;}
.mp-card-foot{display:flex;justify-content:space-between;font-size:8px;color:var(--tm);}
.mp-txs{flex:1;overflow:hidden;padding:6px 12px;}
.mp-tx{display:flex;align-items:center;gap:7px;padding:5px 0;
border-bottom:1px solid rgba(255,255,255,.04);}
.mp-tx:last-child{border-bottom:none;}
.mp-tx-ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.mp-tx-n{font-size:9.5px;font-weight:600;}
.mp-tx-s{font-size:8.5px;color:var(--tm);}
.mp-tx-a{font-size:9.5px;font-weight:700;text-align:right;}
.mp-tx-d{font-size:8px;color:var(--tm);text-align:right;}
.mp-tx-r{text-align:right;}
.mp-bnav{display:grid;grid-template-columns:repeat(4,1fr);
border-top:1px solid var(--border);background:#0b0b12;padding:6px 0 8px;flex-shrink:0;}
.mp-bni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.mp-bni-i{font-size:13px;color:var(--tm);}
.mp-bni-l{font-size:7px;color:var(--tm);}
.mp-bni.act .mp-bni-i{color:var(--gold);}
.mp-bni.act .mp-bni-l{color:var(--gold);}
.mp-bni-dot{width:16px;height:2.5px;background:var(--gold);border-radius:2px;margin-top:1px;}
/* SEND MONEY MINI */
.sm-lbl{font-size:8.5px;color:var(--tm);margin-bottom:4px;}
.sm-rec-box{display:flex;align-items:center;gap:7px;background:#1a1a22;
border:1px solid var(--border);border-radius:8px;padding:7px 9px;}
.sm-av{width:28px;height:28px;border-radius:50%;
background:linear-gradient(135deg,#c45a0a,#ee7820);
display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.sm-rn{font-size:10px;font-weight:600;}
.sm-re{font-size:8.5px;color:var(--tm);}
.sm-amount-box{background:#1a1a22;border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.sm-big{font-size:20px;font-weight:800;}
.sm-pill{display:flex;align-items:center;gap:3px;background:#222230;
border:1px solid var(--border);border-radius:16px;padding:3px 8px;font-size:9px;}
.sm-bal{font-size:8.5px;color:var(--tm);margin-top:3px;}
.sm-exch-box{background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.15);
border-radius:7px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;
font-size:8.5px;color:var(--tm);}
.sm-send-btn{width:100%;padding:11px;border-radius:8px;
background:linear-gradient(135deg,var(--gold),var(--gold-l));
color:#000;font-size:12.5px;font-weight:700;border:none;letter-spacing:.3px;}

/* ── FULL APP LAYOUT ── */
.full-app{display:flex;flex-direction:column;width:100%;height:100%;}
/* SHOPPING APP */
.shop-wrap{display:flex;flex-direction:column;height:100%;background:var(--bg);}
.shop-topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:58px;
background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:50;}
.shop-logo{display:flex;align-items:center;gap:9px;min-width:160px;cursor:pointer;}
.shop-logo-box{width:32px;height:32px;background:var(--gold);border-radius:6px;
display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#000;}
.shop-logo-txt{font-size:14px;font-weight:700;line-height:1;}
.shop-logo-sub{font-size:9px;color:var(--tm);letter-spacing:2px;text-transform:uppercase;}
.shop-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
background:var(--s2);border:1px solid var(--border);border-radius:30px;padding:0 14px;height:38px;}
.shop-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.shop-search input::placeholder{color:var(--td);}
/* ── SEARCH DROPDOWN ── */
.search-wrap{flex:1;max-width:440px;position:relative;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--s2);
border:1px solid var(--border);border-radius:30px;padding:0 14px;height:40px;
transition:.2s;}
.search-box.open{border-color:var(--purple);border-radius:12px 12px 0 0;background:var(--s1);}
.search-box input{background:none;border:none;outline:none;color:var(--text);
font-size:13px;width:100%;font-family:'DM Sans',sans-serif;}
.search-box input::placeholder{color:var(--td);}
.search-icon-btn{font-size:15px;cursor:pointer;flex-shrink:0;padding:0 2px;transition:.2s;}
.search-icon-btn:hover{transform:scale(1.1);}
.search-clear{font-size:13px;cursor:pointer;color:var(--td);flex-shrink:0;transition:.2s;}
.search-clear:hover{color:var(--text);}
.search-dropdown{position:absolute;top:100%;left:0;right:0;
background:var(--s1);border:1px solid var(--purple);border-top:none;
border-radius:0 0 14px 14px;z-index:9999;overflow:hidden;
box-shadow:0 16px 48px rgba(0,0,0,.6);}
.sd-section-hdr{padding:7px 16px 4px;font-size:10px;color:var(--td);
text-transform:uppercase;letter-spacing:2px;font-weight:700;}
.sd-row{display:flex;align-items:center;gap:10px;padding:9px 16px;
cursor:pointer;transition:.15s;border-left:2px solid transparent;}
.sd-row:hover{background:var(--s2);border-left-color:var(--purple);}
.sd-row.active-row{background:var(--s2);border-left-color:var(--purple);}
.sd-row-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0;}
.sd-row-text{font-size:13px;flex:1;}
.sd-row-text mark{background:rgba(201,162,39,.2);color:var(--gold-l);
border-radius:2px;padding:0 2px;font-style:normal;}
.sd-row-meta{font-size:10.5px;color:var(--td);white-space:nowrap;margin-left:4px;}
.sd-row-cat{font-size:10px;padding:2px 7px;border-radius:10px;
background:var(--s3);color:var(--tm);}
.sd-divider{height:1px;background:var(--border);margin:3px 0;}
.sd-footer{display:flex;align-items:center;justify-content:space-between;
padding:8px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--td);}
.sd-footer span{display:flex;align-items:center;gap:6px;}
.sd-kbd{background:var(--s3);border:1px solid var(--border);border-radius:4px;
padding:1px 5px;font-size:10px;color:var(--tm);}
/* ── SEARCH PAGE ── */
.search-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.sort-select{background:var(--s2);border:1px solid var(--border);border-radius:8px;
padding:7px 12px;font-size:12.5px;color:var(--text);cursor:pointer;transition:.2s;}
.sort-select:hover{border-color:var(--purple);}
.price-inputs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tm);}
.price-inp{width:72px;background:var(--s2);border:1px solid var(--border);border-radius:7px;
padding:6px 9px;font-size:12px;color:var(--text);}
.search-stats-bar{display:flex;align-items:center;justify-content:space-between;
padding:11px 16px;background:var(--s1);border:1px solid var(--border);
border-radius:10px;margin-bottom:18px;}
.ssb-left{display:flex;align-items:center;gap:8px;font-size:13px;}
.ssb-q{font-weight:700;color:var(--text);}
.ssb-count{color:var(--tm);}
.ssb-tag{padding:3px 9px;border-radius:10px;background:rgba(124,92,191,.12);
color:var(--purple-l);font-size:11px;display:flex;align-items:center;gap:5px;}
.ssb-tag button{background:none;border:none;color:var(--purple-l);cursor:pointer;
font-size:13px;padding:0;line-height:1;}
.clear-all{font-size:12px;color:var(--purple-l);cursor:pointer;background:none;
border:none;white-space:nowrap;}
.no-results{text-align:center;padding:50px 20px;}
.nr-icon{font-size:56px;margin-bottom:14px;}
.nr-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.nr-sub{font-size:13px;color:var(--tm);margin-bottom:20px;}
.nr-suggestions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.nr-sug{padding:6px 14px;border-radius:16px;background:var(--s2);
border:1px solid var(--border);font-size:12px;cursor:pointer;transition:.15s;color:var(--text);}
.nr-sug:hover{border-color:var(--purple);background:rgba(124,92,191,.1);}
mark{background:rgba(201,162,39,.2);color:var(--gold-l);border-radius:2px;
padding:0 2px;font-style:normal;}

/* ── ADD PRODUCT FORM ── */
.apf-wrap{max-width:760px;}
.apf-steps{display:flex;align-items:center;gap:0;margin-bottom:28px;}
.apf-step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
.apf-step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;transition:.2s;}
.apf-step-line{flex:1;height:2px;margin:0 6px;transition:.2s;}
.apf-section{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.apf-section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
/* Image Upload */
.img-upload-zone{border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:.2s;position:relative;background:var(--s2);}
.img-upload-zone:hover,.img-upload-zone.drag-over{border-color:var(--purple);background:rgba(124,92,191,.05);}
.img-upload-zone.has-image{border-style:solid;border-color:var(--green);padding:0;overflow:hidden;}
.img-preview{width:100%;max-height:260px;object-fit:cover;display:block;border-radius:10px;}
.img-remove-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.img-upload-icon{font-size:40px;margin-bottom:10px;}
.img-upload-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.img-upload-sub{font-size:12px;color:var(--tm);}
.img-upload-btn{display:inline-block;margin-top:12px;padding:9px 20px;border-radius:20px;background:var(--purple);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.img-validation-error{color:var(--red);font-size:12px;margin-top:8px;font-weight:600;}
/* Emoji selector */
.emoji-search{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);width:100%;margin-bottom:10px;}
.emoji-cat-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.emoji-cat-tab{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--s2);color:var(--tm);transition:.15s;}
.emoji-cat-tab.on{background:var(--purple);border-color:var(--purple);color:#fff;}
.emoji-selected-preview{display:flex;align-items:center;gap:10px;padding:12px;background:var(--s2);border-radius:10px;margin-bottom:12px;border:2px solid var(--gold);}
/* Pricing */
.price-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.price-calc-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-top:8px;}
.margin-bar{height:6px;border-radius:3px;margin-top:6px;transition:.3s;}
/* Inventory */
.stock-status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:6px;}
/* API states */
.api-loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px;text-align:center;}
.api-spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.api-phase{font-size:13px;color:var(--tm);}
.api-error-box{background:rgba(231,76,60,.06);border:1px solid rgba(231,76,60,.3);border-radius:12px;padding:16px;margin-bottom:16px;}
.api-success-box{background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.3);border-radius:16px;padding:28px;text-align:center;}
/* Product Preview Card */
.prod-preview-card{background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;gap:16px;align-items:flex-start;}
.ppc-img{width:80px;height:80px;border-radius:10px;background:var(--s2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;overflow:hidden;}
.ppc-img img{width:100%;height:100%;object-fit:cover;}
.ppc-live-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(46,204,113,.1);color:var(--green);margin-top:4px;}
/* Submit button */
.submit-btn-wrap{position:sticky;bottom:20px;z-index:10;}
.apf-submit{width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:800;border:none;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;}
.apf-submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,92,191,.3);}
.apf-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.seller-wrap{max-width:1100px;}
.seller-hero{border-radius:16px;background:linear-gradient(135deg,#0f0f1a,#1a1230,#0f1a0f);
border:1px solid var(--border);padding:28px 32px;margin-bottom:24px;
display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;}
.seller-hero::before{content:'';position:absolute;inset:0;
background:radial-gradient(ellipse at 80% 50%,rgba(201,162,39,.06),transparent 60%);}
.sh-title{font-size:24px;font-weight:800;margin-bottom:4px;}
.sh-sub{font-size:13px;color:var(--tm);}
.sh-badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
padding:5px 12px;border-radius:20px;background:rgba(46,204,113,.1);
border:1px solid rgba(46,204,113,.25);font-size:12px;color:var(--green);font-weight:600;}
.sh-stats{display:flex;gap:24px;position:relative;z-index:1;}
.sh-stat{text-align:center;}
.sh-stat-val{font-size:26px;font-weight:800;color:var(--gold);}
.sh-stat-lbl{font-size:11px;color:var(--tm);margin-top:2px;}
/* TABS */
.seller-tabs{display:flex;gap:4px;margin-bottom:22px;
background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:5px;}
.s-tab{flex:1;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;
cursor:pointer;transition:.2s;text-align:center;border:none;background:none;color:var(--tm);}
.s-tab:hover{color:var(--text);background:var(--s2);}
.s-tab.on{background:var(--purple);color:#fff;}
/* OVERVIEW CARDS */
.seller-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.ss-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.ss-icon{font-size:26px;margin-bottom:10px;}
.ss-label{font-size:11px;color:var(--tm);margin-bottom:4px;}
.ss-value{font-size:22px;font-weight:800;}
.ss-change{font-size:11px;margin-top:4px;}
.ss-change.up{color:var(--green);}
.ss-change.dn{color:var(--red);}
/* PRODUCT TABLE */
.prod-table{width:100%;border-collapse:collapse;}
.pt-head th{padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;
letter-spacing:1px;color:var(--td);text-align:left;
border-bottom:1px solid var(--border);background:var(--s1);}
.pt-head th:first-child{border-radius:10px 0 0 0;}
.pt-head th:last-child{border-radius:0 10px 0 0;}
.pt-row td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);
vertical-align:middle;}
.pt-row:last-child td{border-bottom:none;}
.pt-row:hover td{background:rgba(255,255,255,.02);}
.pt-img{font-size:28px;text-align:center;}
.pt-status{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
border-radius:12px;font-size:11px;font-weight:700;}
.pt-status.live{background:rgba(46,204,113,.1);color:var(--green);}
.pt-status.draft{background:rgba(201,162,39,.1);color:var(--gold);}
.pt-status.paused{background:rgba(136,136,144,.1);color:var(--tm);}
.pt-action{padding:5px 11px;border-radius:7px;font-size:11.5px;font-weight:600;
cursor:pointer;transition:.15s;border:1px solid var(--border);background:var(--s2);color:var(--text);}
.pt-action:hover{background:var(--s3);}
.pt-action.danger{color:var(--red);}
.pt-action.danger:hover{background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.3);}
/* ADD PRODUCT FORM */
.add-prod-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.add-prod-form .full{grid-column:1/-1;}
.emoji-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.emoji-opt{width:44px;height:44px;border-radius:9px;background:var(--s2);
border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
font-size:22px;cursor:pointer;transition:.15s;}
.emoji-opt:hover{border-color:var(--purple);}
.emoji-opt.sel{border-color:var(--gold);background:rgba(201,162,39,.1);}
/* ORDERS TABLE */
.order-table{width:100%;border-collapse:collapse;}
.ot-row td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
.ot-row:hover td{background:rgba(255,255,255,.02);}
.ot-buyer{display:flex;align-items:center;gap:8px;}
.ot-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.ot-status{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
border-radius:12px;font-size:11px;font-weight:700;}
.ot-status.pending{background:rgba(243,156,18,.1);color:#f39c12;}
.ot-status.shipped{background:rgba(52,152,219,.1);color:#3498db;}
.ot-status.delivered{background:rgba(46,204,113,.1);color:var(--green);}
/* ANALYTICS */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.chart-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.chart-card-title{font-size:13px;font-weight:700;margin-bottom:14px;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:100px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--purple);
min-height:4px;transition:.4s;position:relative;}
.bar:hover{background:var(--purple-l);}
.bar-label{font-size:9px;color:var(--tm);}
.bar-val{font-size:8px;color:var(--tm);}
.top-products{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.tp-item{display:flex;align-items:center;gap:12px;padding:9px 0;
border-bottom:1px solid rgba(255,255,255,.04);}
.tp-item:last-child{border-bottom:none;}
.tp-rank{width:24px;height:24px;border-radius:50%;background:var(--s3);
display:flex;align-items:center;justify-content:center;font-size:11px;
font-weight:800;flex-shrink:0;}
.tp-rank:nth-child(1){background:rgba(201,162,39,.2);color:var(--gold);}
.tp-bar-bg{flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden;}
.tp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--purple),var(--gold));}
.shop-actions{display:flex;align-items:center;gap:7px;margin-left:auto;}
.s-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;
background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:12.5px;
cursor:pointer;transition:.2s;white-space:nowrap;position:relative;}
.s-btn:hover{background:var(--s3);}
.s-btn-ai{background:linear-gradient(135deg,#3a2a7a,#5a3db5);border-color:#7c5cbf44;}
.cart-badge{background:var(--gold);color:#000;font-size:8px;font-weight:800;
border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;
position:absolute;top:-4px;right:-4px;}
.shop-body{display:flex;flex:1;overflow:hidden;}
.shop-sidebar{width:175px;min-width:175px;background:var(--s1);border-right:1px solid var(--border);
overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;}
.s-nav-item{display:flex;align-items:center;gap:9px;padding:9px 15px;font-size:12.5px;
color:var(--tm);cursor:pointer;transition:.15s;user-select:none;}
.s-nav-item:hover{background:var(--s2);color:var(--text);}
.s-nav-item.act{background:var(--s2);color:var(--text);border-left:3px solid var(--gold);}
.s-nav-item.gld{color:var(--gold-l);}
.s-nav-item.prp{color:var(--purple-l);}
.s-divider{height:1px;background:var(--border);margin:7px 12px;}
.ai-card-side{margin:12px 10px;padding:13px;border-radius:var(--r);
background:linear-gradient(135deg,var(--purple),var(--purple-l));border:none;cursor:pointer;box-shadow:var(--shadow);}
.ai-card-side:hover{opacity:.92;transform:translateY(-1px);}
.ac-title{font-size:11.5px;font-weight:700;margin-bottom:2px;color:#fff;}
.ac-sub{font-size:10px;color:rgba(255,255,255,.7);margin-bottom:9px;}
.ac-orb{width:56px;height:56px;margin:0 auto;border-radius:50%;
background:rgba(255,255,255,.15);
display:flex;align-items:center;justify-content:center;font-size:24px;}
.shop-main{flex:1;overflow-y:auto;padding:20px;}
/* SECTIONS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-size:15px;font-weight:600;}
.sec-link{font-size:12px;color:var(--purple-l);cursor:pointer;background:none;border:none;color:var(--purple-l);}
.sec-link:hover{text-decoration:underline;}
/* HERO */
.hero-banner{border-radius:20px;overflow:hidden;position:relative;
background:linear-gradient(135deg,#5a3db5 0%,#7c5cbf 45%,#9b7de0 100%);
border:none;margin-bottom:22px;padding:38px 42px;
display:flex;align-items:center;min-height:220px;box-shadow:0 12px 40px rgba(124,92,191,.3);}
.hero-bg{position:absolute;inset:0;
background:radial-gradient(ellipse at 80% 10%,rgba(255,255,255,.12),transparent 55%),
           radial-gradient(ellipse at 10% 90%,rgba(0,0,0,.08),transparent 50%);}
.hero-content{position:relative;z-index:2;max-width:340px;}
.hero-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;
color:rgba(255,255,255,.65);margin-bottom:7px;}
.hero-title{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;
line-height:1.15;color:#fff;}
.hero-title span{color:#fde68a;}
.hero-sub{font-size:13.5px;color:rgba(255,255,255,.78);margin:10px 0 20px;line-height:1.65;}
.hero-btn{display:inline-flex;align-items:center;gap:7px;padding:12px 26px;
background:#fff;color:var(--purple);border-radius:30px;font-size:13px;font-weight:800;
cursor:pointer;transition:.2s;border:none;box-shadow:0 4px 14px rgba(0,0,0,.15);}
.hero-btn:hover{background:#fde68a;color:#5a3db5;transform:translateY(-1px);}
.hero-products{position:absolute;right:42px;top:50%;transform:translateY(-50%);
display:flex;gap:16px;align-items:center;}
.hero-prod{width:108px;height:108px;border-radius:16px;
background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
display:flex;align-items:center;justify-content:center;
font-size:44px;transition:.2s;backdrop-filter:blur(4px);}
.hero-prod:hover{transform:scale(1.06) rotate(-2deg);background:rgba(255,255,255,.25);}
.hero-prod.lg{width:128px;height:128px;font-size:52px;}
/* FEATURE ROW */
.feat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.feat-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
padding:13px 15px;display:flex;align-items:center;gap:11px;
box-shadow:var(--shadow);transition:.2s;cursor:pointer;}
.feat-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.feat-ico{font-size:22px;}
.feat-title{font-size:13px;font-weight:700;}
.feat-sub{font-size:11px;color:var(--tm);margin-top:1px;}
/* CATEGORIES */
.cats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:22px;}
.cat-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
overflow:hidden;cursor:pointer;transition:.2s;position:relative;}
.cat-card:hover{border-color:var(--gold);transform:translateY(-2px);}
.cat-img{height:90px;display:flex;align-items:center;justify-content:center;
font-size:34px;background:var(--s2);}
.cat-label{padding:7px;text-align:center;font-size:12px;font-weight:500;}
/* PRODUCT CARDS */
.products-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.products-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.prod-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
padding:14px;cursor:pointer;transition:.2s;position:relative;}
.prod-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.12);}
.prod-img{font-size:44px;text-align:center;margin-bottom:10px;}
.prod-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.prod-sub{font-size:11px;color:var(--tm);margin-bottom:7px;}
.prod-stars{color:var(--gold);font-size:11px;margin-bottom:6px;}
.prod-price{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.price-now{font-size:16px;font-weight:700;}
.price-was{font-size:11px;color:var(--td);text-decoration:line-through;}
.price-badge{background:rgba(231,76,60,.12);color:var(--red);font-size:10px;
font-weight:700;padding:2px 6px;border-radius:4px;}
.wish-btn{position:absolute;top:10px;right:10px;font-size:16px;cursor:pointer;
background:none;border:none;color:var(--td);transition:.2s;}
.wish-btn.on{color:var(--red);}
.add-cart-btn{width:100%;margin-top:10px;padding:8px;border-radius:8px;
background:var(--s3);border:1px solid var(--border);color:var(--text);
font-size:12px;font-weight:600;cursor:pointer;transition:.2s;}
.add-cart-btn:hover{background:var(--purple);border-color:var(--purple);}
/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;}
.bot-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:15px;}
.bot-card-title{font-size:13px;font-weight:600;margin-bottom:12px;}
/* AI RECS */
.recs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.rec-item{text-align:center;cursor:pointer;position:relative;}
.rec-img{font-size:28px;background:var(--s2);border-radius:7px;
padding:12px 8px;margin-bottom:5px;border:1px solid var(--border);}
.rec-name{font-size:10px;font-weight:500;line-height:1.2;}
.rec-price{font-size:11px;color:var(--tm);margin-top:2px;}
.rec-star{color:var(--gold);font-size:9px;}
/* VOICE */
.voice-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;
height:120px;gap:8px;}
.wave-row{display:flex;align-items:center;gap:3px;height:32px;}
.wb{width:3px;background:linear-gradient(to top,var(--purple),var(--gold));
border-radius:2px;animation:wv .8s ease-in-out infinite;}
@keyframes wv{0%,100%{height:4px;}50%{height:24px;}}
.voice-lbl{font-size:12px;color:var(--tm);}
.voice-hint{font-size:10.5px;color:var(--td);text-align:center;}
.mic-btn{width:44px;height:44px;border-radius:50%;background:var(--purple);
display:flex;align-items:center;justify-content:center;font-size:18px;
cursor:pointer;border:none;transition:.2s;}
.mic-btn:hover{transform:scale(1.08);background:var(--purple-l);}
/* FLASH DEALS */
.countdown{display:flex;gap:6px;align-items:center;margin-bottom:12px;}
.cnt-box{background:var(--s2);border-radius:6px;padding:7px 11px;text-align:center;min-width:44px;}
.cnt-num{font-size:19px;font-weight:700;line-height:1;}
.cnt-lbl{font-size:8.5px;color:var(--tm);margin-top:1px;}
.cnt-sep{font-size:17px;font-weight:700;color:var(--td);}
.flash-item{display:flex;align-items:center;gap:11px;}
.flash-img{font-size:34px;}
.flash-info{flex:1;}
.flash-name{font-size:12.5px;font-weight:600;}
.flash-sub{font-size:10.5px;color:var(--tm);margin-bottom:3px;}
.flash-price-row{display:flex;align-items:center;gap:7px;}
.flash-price{font-size:20px;font-weight:700;}
.flash-was{font-size:11px;color:var(--td);text-decoration:line-through;}
.flash-off{background:rgba(231,76,60,.12);color:var(--red);font-size:10px;
font-weight:700;padding:2px 6px;border-radius:4px;}
/* SELLER DASHBOARD */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.stat-item .s-lbl{font-size:9.5px;color:var(--tm);}
.stat-item .s-val{font-size:15px;font-weight:700;margin:2px 0;}
.stat-item .s-chg{font-size:10px;}
.s-chg.up{color:var(--green);}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;z-index:9999;
padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;
background:var(--s3);border:1px solid rgba(255,255,255,.12);
box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fadeIn .3s ease;}
.toast-success{border-color:rgba(46,204,113,.3);background:rgba(13,42,24,.9);}
.toast-error{border-color:rgba(231,76,60,.3);background:rgba(42,13,13,.9);}
.toast-info{border-color:rgba(124,92,191,.3);background:rgba(26,13,48,.9);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* PRODUCT DETAIL */
.prod-detail{max-width:800px;margin:0 auto;}
.pd-top{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:28px;}
.pd-img{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
display:flex;align-items:center;justify-content:center;font-size:100px;
height:280px;}
.pd-info{}
.pd-category{font-size:11px;color:var(--tm);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
.pd-name{font-size:24px;font-weight:700;margin-bottom:6px;}
.pd-stars{color:var(--gold);font-size:14px;margin-bottom:12px;}
.pd-price-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.pd-now{font-size:28px;font-weight:700;}
.pd-was{font-size:16px;color:var(--td);text-decoration:line-through;}
.pd-save{background:rgba(231,76,60,.12);color:var(--red);font-size:12px;
font-weight:700;padding:4px 10px;border-radius:6px;}
.pd-desc{font-size:13px;color:var(--tm);line-height:1.7;margin-bottom:18px;}
.pd-actions{display:flex;gap:10px;}
.pd-add{flex:1;padding:13px;border-radius:10px;background:var(--purple);
color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.2s;}
.pd-add:hover{background:var(--purple-l);}
.pd-wish{width:50px;height:50px;border-radius:10px;background:var(--s2);
border:1px solid var(--border);font-size:20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;}

.pd-back{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tm);
cursor:pointer;margin-bottom:20px;background:none;border:none;color:var(--tm);}
.pd-back:hover{color:var(--text);}

/* CART PAGE */
.cart-wrap{display:grid;grid-template-columns:1fr 380px;gap:20px;}
.cart-items{}
.cart-item{display:flex;align-items:center;gap:14px;background:var(--s1);
border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.ci-img{font-size:40px;width:70px;text-align:center;flex-shrink:0;}
.ci-info{flex:1;}
.ci-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.ci-sub{font-size:11px;color:var(--tm);}
.ci-price{font-size:16px;font-weight:700;margin-top:6px;}
.ci-actions{display:flex;align-items:center;gap:8px;margin-top:8px;}
.qty-btn{width:28px;height:28px;border-radius:6px;background:var(--s2);
border:1px solid var(--border);font-size:14px;display:flex;align-items:center;
justify-content:center;cursor:pointer;transition:.2s;}
.qty-btn:hover{background:var(--s3);}
.qty-val{font-size:14px;font-weight:600;min-width:24px;text-align:center;}
.ci-remove{background:none;border:none;color:var(--td);font-size:18px;

.ci-remove:hover{color:var(--red);}
.cart-summary{background:var(--s1);border:1px solid var(--border);
border-radius:var(--r);padding:20px;height:fit-content;position:sticky;top:0;}
.cs-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.cs-row{display:flex;justify-content:space-between;font-size:13px;
margin-bottom:10px;color:var(--tm);}
.cs-row.total{color:var(--text);font-weight:700;font-size:16px;
border-top:1px solid var(--border);padding-top:12px;margin-top:4px;}
.checkout-btn{width:100%;padding:14px;border-radius:10px;
background:linear-gradient(135deg,var(--gold),var(--gold-l));
color:#000;font-size:14px;font-weight:700;border:none;cursor:pointer;
margin-top:16px;transition:.2s;}
.checkout-btn:hover{opacity:.9;}
.checkout-btn:disabled{opacity:.4;cursor:not-allowed;}
.empty-state{text-align:center;padding:60px 20px;color:var(--tm);}
.empty-state .es-icon{font-size:60px;margin-bottom:16px;}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text);}
.empty-state p{font-size:13px;margin-bottom:20px;}

/* AI CHAT */
.ai-chat-wrap{display:flex;height:calc(100vh - 120px);gap:16px;}
.ai-chat-main{flex:1;display:flex;flex-direction:column;background:var(--s1);
border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-msg-user{align-self:flex-end;background:var(--purple);
border-radius:14px 14px 2px 14px;padding:10px 14px;font-size:13px;max-width:70%;}
.chat-msg-ai{align-self:flex-start;background:var(--s2);border:1px solid var(--border);
border-radius:14px 14px 14px 2px;padding:10px 14px;font-size:13px;max-width:75%;}
.chat-msg-ai .ai-tag{color:var(--purple-l);font-size:11px;margin-bottom:4px;font-weight:600;}
.chat-typing{display:flex;gap:4px;padding:4px 0;}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--tm);
animation:tdot 1s ease-in-out infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes tdot{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-4px);}}
.chat-input-row{display:flex;align-items:center;gap:8px;padding:12px;
border-top:1px solid var(--border);}
.chat-input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:22px;
padding:9px 15px;font-size:13px;color:var(--text);}
.chat-input:focus{border-color:var(--purple);}
.chat-send{width:38px;height:38px;border-radius:50%;background:var(--purple);
display:flex;align-items:center;justify-content:center;font-size:16px;border:none;
cursor:pointer;transition:.2s;flex-shrink:0;}
.chat-send:hover{background:var(--purple-l);}
.chat-suggestions{display:flex;gap:7px;padding:10px 12px 0;flex-wrap:wrap;}
.chat-sug{padding:5px 12px;border-radius:16px;background:var(--s3);
border:1px solid var(--border);font-size:11.5px;color:var(--text);
cursor:pointer;transition:.15s;}
.chat-sug:hover{background:rgba(124,92,191,.2);border-color:var(--purple);}

/* VOICE SEARCH PAGE */
.voice-page{display:flex;flex-direction:column;align-items:center;
justify-content:center;height:400px;gap:16px;text-align:center;}
.vp-title{font-size:22px;font-weight:700;}
.vp-sub{font-size:13px;color:var(--tm);}
.vp-wave{display:flex;align-items:center;gap:4px;height:48px;}
.vp-wb{width:4px;background:linear-gradient(to top,var(--purple),var(--gold));
border-radius:3px;animation:wv .8s ease-in-out infinite;}
.vp-mic{width:72px;height:72px;border-radius:50%;background:var(--purple);
display:flex;align-items:center;justify-content:center;font-size:30px;
border:none;cursor:pointer;transition:.2s;
box-shadow:0 0 0 0 rgba(124,92,191,.5);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,191,.5);}70%{box-shadow:0 0 0 16px rgba(124,92,191,0);}100%{box-shadow:0 0 0 0 rgba(124,92,191,0);}}
.vp-hint{font-size:12px;color:var(--td);font-style:italic;}

/* IMAGE SEARCH PAGE */
.img-search-page{max-width:700px;}
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);
padding:40px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:20px;}
.upload-zone:hover{border-color:var(--purple);background:rgba(124,92,191,.05);}
.upload-icon{font-size:48px;margin-bottom:12px;}
.upload-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.upload-sub{font-size:13px;color:var(--tm);}
.uploaded-preview{border-radius:var(--r);background:var(--s1);
border:1px solid var(--border);padding:20px;margin-bottom:20px;text-align:center;}

/* ORDERS */
.order-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
padding:16px;margin-bottom:12px;cursor:pointer;transition:.2s;}
.order-card:hover{border-color:rgba(255,255,255,.12);}
.oc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.oc-id{font-size:12px;color:var(--tm);}
.oc-date{font-size:12px;color:var(--tm);}
.oc-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;}
.st-delivered{background:rgba(46,204,113,.12);color:var(--green);}
.st-shipped{background:rgba(201,162,39,.12);color:var(--gold);}
.st-processing{background:rgba(124,92,191,.12);color:var(--purple-l);}
.oc-items{display:flex;gap:8px;margin-bottom:10px;}
.oc-item-img{font-size:28px;}
.oc-footer{display:flex;align-items:center;justify-content:space-between;}
.oc-total{font-size:15px;font-weight:700;}
.oc-reorder{padding:7px 16px;border-radius:8px;background:var(--s2);
border:1px solid var(--border);font-size:12px;cursor:pointer;transition:.2s;}
.oc-reorder:hover{background:var(--s3);}

/* SEARCH RESULTS */
.search-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.search-count{font-size:13px;color:var(--tm);}
.filter-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;
border:1px solid var(--border);background:var(--s2);color:var(--tm);cursor:pointer;transition:.2s;}
.filter-btn:hover{color:var(--text);}
.filter-btn.on{background:var(--purple);border-color:var(--purple);color:#fff;}

/* MESSAGES */
.messages-wrap{display:flex;height:calc(100vh - 140px);gap:0;background:var(--s1);
border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.msg-list{width:280px;border-right:1px solid var(--border);overflow-y:auto;}
.msg-list-header{padding:14px 16px;font-size:14px;font-weight:600;
border-bottom:1px solid var(--border);}
.msg-thread{display:flex;align-items:center;gap:11px;padding:12px 16px;
cursor:pointer;transition:.15s;border-bottom:1px solid var(--border);}
.msg-thread:hover{background:var(--s2);}
.msg-thread.sel{background:var(--s3);}
.msg-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:16px;flex-shrink:0;}
.msg-av-shop{background:rgba(201,162,39,.2);border:1px solid rgba(201,162,39,.3);}
.msg-av-supp{background:rgba(124,92,191,.2);border:1px solid rgba(124,92,191,.3);}
.msg-thread-name{font-size:13px;font-weight:600;}
.msg-thread-preview{font-size:11px;color:var(--tm);margin-top:1px;}
.msg-thread-time{font-size:10px;color:var(--td);margin-left:auto;flex-shrink:0;}
.msg-chat-area{flex:1;display:flex;flex-direction:column;}
.mca-header{padding:12px 16px;border-bottom:1px solid var(--border);}
.mca-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.mca-msg{max-width:65%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5;}
.mca-msg.them{align-self:flex-start;background:var(--s2);border:1px solid var(--border);
border-radius:12px 12px 12px 2px;}
.mca-msg.me{align-self:flex-end;background:var(--purple);border-radius:12px 12px 2px 12px;}
.mca-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);}
.mca-inp{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:20px;
padding:8px 14px;font-size:13px;color:var(--text);}
.mca-inp:focus{border-color:var(--purple);}
.mca-send{width:38px;height:38px;border-radius:50%;background:var(--purple);
display:flex;align-items:center;justify-content:center;font-size:15px;border:none;cursor:pointer;}

/* WALLET APP */
.wallet-wrap{display:flex;flex-direction:column;height:100%;background:var(--bg);}
.w-topbar{display:flex;align-items:center;justify-content:space-between;
padding:10px 18px;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:var(--shadow);}
.w-back{font-size:14px;color:var(--tm);cursor:pointer;padding:4px 8px;
border-radius:6px;background:none;border:none;color:var(--tm);display:flex;align-items:center;gap:4px;}
.w-back:hover{color:var(--text);}
.w-brand{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--purple);}
.w-action-icon{font-size:18px;cursor:pointer;color:var(--tm);}
.wallet-main{flex:1;overflow-y:auto;padding:18px;}
.wallet-body{display:flex;flex-direction:column;gap:16px;}
/* WALLET HOME */
.w-balance-card{background:linear-gradient(135deg,#5a3db5,#7c5cbf,#9b7de0);
border:none;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(124,92,191,.35);}
.wbc-label{font-size:11px;color:rgba(255,255,255,.75);margin-bottom:5px;}
.wbc-amount{font-size:36px;font-weight:800;margin-bottom:3px;color:#fff;}
.wbc-currency{font-size:14px;color:rgba(255,255,255,.7);}
.wbc-change{font-size:11px;color:#a8f4c8;margin-top:4px;}
.w-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.w-act-btn{display:flex;flex-direction:column;align-items:center;gap:6px;
cursor:pointer;padding:10px;border-radius:12px;transition:.2s;background:var(--s1);
border:1px solid var(--border);box-shadow:var(--shadow);}
.w-act-btn:hover{background:var(--s2);transform:translateY(-1px);}
.w-act-ico{width:50px;height:50px;border-radius:50%;
background:linear-gradient(135deg,rgba(124,92,191,.12),rgba(124,92,191,.2));
border:1px solid rgba(124,92,191,.2);
display:flex;align-items:center;justify-content:center;font-size:22px;}
.w-act-lbl{font-size:12px;color:var(--tm);text-align:center;}
.w-section{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
.w-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.w-sec-title{font-size:14px;font-weight:600;}
.w-view-all{font-size:12px;color:var(--purple);cursor:pointer;background:none;border:none;color:var(--purple);}
.w-card{border-radius:14px;padding:20px;
background:linear-gradient(135deg,#1a1508,#2e2410,#1a1508);
border:1px solid rgba(201,162,39,.3);position:relative;overflow:hidden;}
.w-card::before{content:'';position:absolute;inset:0;
background:radial-gradient(ellipse at 80% 20%,rgba(201,162,39,.15),transparent 60%);}
.w-card-crown{font-size:18px;margin-bottom:5px;}
.w-card-brand{font-size:11px;font-weight:800;letter-spacing:3px;color:#e8b84b;margin-bottom:14px;}
.w-card-num{font-size:15px;letter-spacing:3px;font-family:monospace;margin-bottom:10px;color:#fff;}
.w-card-footer{display:flex;justify-content:space-between;align-items:center;}
.w-card-name{font-size:11px;color:rgba(255,255,255,.65);}
.w-card-exp{font-size:11px;color:rgba(255,255,255,.65);}
.w-tx-item{display:flex;align-items:center;gap:12px;padding:10px 0;
border-bottom:1px solid var(--border);}
.w-tx-item:last-child{border-bottom:none;}
.w-tx-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.w-tx-info{flex:1;}
.w-tx-name{font-size:13px;font-weight:600;}
.w-tx-sub{font-size:11px;color:var(--tm);}
.w-tx-right{text-align:right;}
.w-tx-amount{font-size:13px;font-weight:700;}
.w-tx-amount.neg{color:var(--text);}
.w-tx-amount.pos{color:var(--green);}
.w-tx-date{font-size:10.5px;color:var(--tm);}
/* BOTTOM NAV */
.wallet-bnav{display:grid;grid-template-columns:repeat(4,1fr);
border-top:1px solid var(--border);background:var(--s1);padding:10px 0 14px;flex-shrink:0;box-shadow:0 -2px 12px rgba(0,0,0,.06);}
.w-bnav-i{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.w-bnav-ico{font-size:22px;color:var(--td);transition:.2s;}
.w-bnav-lbl{font-size:11px;color:var(--td);transition:.2s;}
.w-bnav-i.act .w-bnav-ico{color:var(--purple);}
.w-bnav-i.act .w-bnav-lbl{color:var(--purple);}
.w-bnav-dot{width:20px;height:3px;background:var(--purple);border-radius:2px;margin-top:3px;}
/* SEND MONEY PAGE */
.send-form{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:12px;color:var(--tm);}
.form-input{background:var(--s2);border:1px solid var(--border);border-radius:10px;
padding:11px 14px;font-size:14px;color:var(--text);transition:.2s;}
.form-input:focus{border-color:var(--purple);}
.form-input.error{border-color:var(--red);}
.form-error{font-size:11px;color:var(--red);}
.recipient-row{display:flex;align-items:center;gap:10px;
background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;}
.rec-avatar{width:38px;height:38px;border-radius:50%;
background:linear-gradient(135deg,#c45a0a,#ee7820);
display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;}
.rec-name{font-size:14px;font-weight:600;}
.rec-email{font-size:11px;color:var(--tm);}
.amount-input-row{display:flex;align-items:center;gap:10px;
background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;}
.amount-input-row input{background:none;border:none;font-size:28px;
font-weight:800;color:var(--text);flex:1;min-width:0;}
.currency-pill{display:flex;align-items:center;gap:5px;background:var(--s3);
border:1px solid var(--border);border-radius:20px;padding:6px 12px;
font-size:13px;cursor:pointer;white-space:nowrap;}
.exchange-info{display:flex;align-items:center;justify-content:space-between;
background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.2);
border-radius:10px;padding:12px 14px;}
.exchange-rate{font-size:12px;color:var(--tm);}
.exchange-rate strong{color:var(--text);}
.exchange-change{color:var(--green);font-size:12px;font-weight:600;}
.action-btn-full{width:100%;padding:15px;border-radius:12px;
background:linear-gradient(135deg,var(--gold),var(--gold-l));
color:#000;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:.2s;}
.action-btn-full:hover{opacity:.9;}
.action-btn-full:disabled{opacity:.4;cursor:not-allowed;}
.success-screen{display:flex;flex-direction:column;align-items:center;
justify-content:center;padding:40px;text-align:center;gap:16px;}

@keyframes bounceIn{0%{transform:scale(0);}60%{transform:scale(1.1);}100%{transform:scale(1);}}
.success-title{font-size:24px;font-weight:700;}
.success-sub{font-size:14px;color:var(--tm);}

.receive-page{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;}
.qr-code{background:#fff;border-radius:16px;padding:20px;width:200px;height:200px;
display:flex;align-items:center;justify-content:center;}
.qr-address{background:var(--s2);border:1px solid var(--border);border-radius:10px;
padding:12px 16px;font-size:12px;font-family:monospace;color:var(--tm);
max-width:400px;word-break:break-all;text-align:center;}
.copy-btn{padding:10px 24px;border-radius:8px;background:var(--s2);
border:1px solid var(--border);font-size:13px;cursor:pointer;transition:.2s;}
.copy-btn:hover{background:var(--s3);}

.exchange-wrap{max-width:500px;margin:0 auto;}
.exchange-card{background:var(--s1);border:1px solid var(--border);
border-radius:16px;padding:24px;margin-bottom:16px;}
.exc-from,.exc-to{margin-bottom:12px;}
.exc-label{font-size:11px;color:var(--tm);margin-bottom:6px;}
.exc-row{display:flex;align-items:center;gap:10px;}
.exc-input{flex:1;background:var(--s2);border:1px solid var(--border);
border-radius:10px;padding:12px 14px;font-size:18px;font-weight:700;color:var(--text);}
.exc-swap-btn{width:44px;height:44px;border-radius:50%;background:var(--s2);
border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
font-size:18px;cursor:pointer;margin:8px auto;transition:.2s;}
.exc-swap-btn:hover{background:var(--s3);}
.exc-rate-display{background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.2);
border-radius:10px;padding:14px;text-align:center;margin-bottom:16px;}
.exc-rate-num{font-size:22px;font-weight:700;color:var(--gold);}
.exc-rate-sub{font-size:12px;color:var(--tm);margin-top:3px;}

.cards-page{}
.card-item{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
overflow:hidden;margin-bottom:12px;}
.card-display{padding:20px;background:linear-gradient(135deg,#1a1508,#2e2410,#1a1508);
border-bottom:1px solid var(--border);position:relative;}
.card-actions-row{display:flex;gap:8px;padding:12px 14px;}
.card-action{flex:1;padding:8px;border-radius:8px;background:var(--s2);

display:flex;align-items:center;justify-content:center;gap:5px;}
.card-action:hover{background:var(--s3);}
.card-action.danger{color:var(--red);}
.add-card-btn{width:100%;padding:14px;border-radius:10px;background:var(--s2);

.tx-filters{display:flex;gap:8px;margin-bottom:20px;}
.tx-filter{padding:7px 16px;border-radius:20px;font-size:12.5px;
border:1px solid var(--border);background:var(--s2);color:var(--tm);cursor:pointer;transition:.2s;}
.tx-filter.on{background:var(--purple);border-color:var(--purple);color:#fff;}
.tx-list-full{}
.tx-full-item{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:var(--s1);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.tfi-ico{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;}
.tfi-info{flex:1;}
.tfi-name{font-size:14px;font-weight:600;}
.tfi-sub{font-size:11.5px;color:var(--tm);}
.tfi-right{text-align:right;}
.tfi-amount{font-size:15px;font-weight:700;}
.tfi-date{font-size:11px;color:var(--tm);}

/* PROFILE PAGE */
.profile-page{max-width:500px;}
.profile-header{display:flex;align-items:center;gap:18px;
background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
padding:20px;margin-bottom:16px;}
.profile-av{width:70px;height:70px;border-radius:50%;
background:linear-gradient(135deg,#c45a0a,#ee7820);
display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;}
.profile-name{font-size:20px;font-weight:700;}
.profile-email{font-size:13px;color:var(--tm);}
.profile-badge{margin-top:5px;display:inline-block;padding:3px 10px;border-radius:12px;
background:rgba(201,162,39,.12);color:var(--gold);font-size:11px;font-weight:600;}
.settings-section{background:var(--s1);border:1px solid var(--border);
border-radius:var(--r);overflow:hidden;margin-bottom:16px;}
.settings-item{display:flex;align-items:center;justify-content:space-between;
padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.15s;}
.settings-item:last-child{border-bottom:none;}
.settings-item:hover{background:var(--s2);}
.si-left{display:flex;align-items:center;gap:12px;}
.si-icon{font-size:18px;}
.si-label{font-size:13px;font-weight:500;}
.si-sub{font-size:11px;color:var(--tm);margin-top:1px;}
.si-right{font-size:14px;color:var(--td);}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--s3);
border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;}
.toggle.on{background:var(--purple);}
.toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;
border-radius:50%;background:#fff;transition:.2s;}
.toggle.on .toggle-thumb{left:21px;}
.logout-btn{width:100%;padding:14px;border-radius:10px;background:rgba(231,76,60,.1);
border:1px solid rgba(231,76,60,.2);color:var(--red);font-size:14px;font-weight:600;cursor:pointer;}
.logout-btn:hover{background:rgba(220,38,38,.1);}

/* ── AUTH SCREEN ── */
.auth-wrap{width:100%;height:100%;display:flex;background:var(--bg);}
.auth-left{width:440px;min-width:440px;background:linear-gradient(160deg,#5a3db5,#7c5cbf,#9b7de0);
display:flex;flex-direction:column;justify-content:center;padding:60px 48px;position:relative;overflow:hidden;}
.auth-left::before{content:'';position:absolute;top:-100px;right:-100px;width:300px;height:300px;
border-radius:50%;background:rgba(255,255,255,.06);}
.auth-left::after{content:'';position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;
border-radius:50%;background:rgba(255,255,255,.05);}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:40px;position:relative;z-index:1;}
.auth-brand-box{width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:10px;
display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;
border:1px solid rgba(255,255,255,.3);}
.auth-brand-name{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;}
.auth-left h2{font-size:30px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:12px;position:relative;z-index:1;}
.auth-left p{font-size:14px;color:rgba(255,255,255,.75);line-height:1.7;margin-bottom:36px;position:relative;z-index:1;}
.auth-features{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;}
.auth-feat{display:flex;align-items:center;gap:12px;}
.auth-feat-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);
display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.auth-feat-text{font-size:13px;color:rgba(255,255,255,.85);}
.auth-right{flex:1;display:flex;flex-direction:column;justify-content:center;
align-items:center;padding:40px 60px;overflow-y:auto;}
.auth-box{width:100%;max-width:420px;}
.auth-tabs{display:flex;background:var(--s2);border-radius:12px;padding:5px;margin-bottom:28px;}
.auth-tab{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:700;
border:none;cursor:pointer;transition:.2s;background:none;color:var(--tm);}
.auth-tab.on{background:var(--s1);color:var(--purple);box-shadow:var(--shadow);}
.auth-title{font-size:24px;font-weight:800;margin-bottom:5px;}
.auth-sub{font-size:13px;color:var(--tm);margin-bottom:24px;}
.auth-form{display:flex;flex-direction:column;gap:14px;}
.auth-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.auth-input-wrap{display:flex;flex-direction:column;gap:5px;}
.auth-label{font-size:12px;font-weight:600;color:var(--text);}
.auth-input{background:var(--s2);border:1.5px solid var(--border);border-radius:10px;
padding:12px 14px;font-size:14px;color:var(--text);transition:.2s;width:100%;}
.auth-input:focus{border-color:var(--purple);background:var(--s1);}
.auth-input.err{border-color:var(--red);}
.auth-err{font-size:11px;color:var(--red);}
.auth-submit{width:100%;padding:14px;border-radius:12px;
background:linear-gradient(135deg,var(--purple),var(--purple-l));
color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;
transition:.2s;margin-top:4px;}
.auth-submit:hover{opacity:.92;transform:translateY(-1px);}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--td);font-size:12px;margin:16px 0;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.social-btns{display:flex;gap:10px;}
.social-btn{flex:1;padding:11px;border-radius:10px;background:var(--s1);
border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;
transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.social-btn:hover{border-color:var(--purple);background:var(--s2);}
.auth-switch{text-align:center;font-size:13px;color:var(--tm);margin-top:20px;}
.auth-switch span{color:var(--purple);cursor:pointer;font-weight:600;}
.auth-switch span:hover{text-decoration:underline;}
.auth-check-row{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--tm);}
.auth-check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--purple);margin-top:2px;flex-shrink:0;}

/* ── NOTIFICATIONS ── */
.notif-bell-wrap{position:relative;}
.notif-bell-btn{width:40px;height:40px;border-radius:10px;background:var(--s2);
border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
font-size:18px;cursor:pointer;transition:.2s;position:relative;}
.notif-bell-btn:hover{background:var(--s3);}
.notif-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;
border-radius:9px;background:var(--red);color:#fff;font-size:9px;font-weight:800;
display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg);}
.notif-panel{position:absolute;top:calc(100%+10px);right:0;width:360px;
background:var(--s1);border:1px solid var(--border);border-radius:16px;
box-shadow:var(--shadow-lg);z-index:500;overflow:hidden;}
.np-header{display:flex;align-items:center;justify-content:space-between;
padding:14px 16px;border-bottom:1px solid var(--border);}
.np-title{font-size:15px;font-weight:700;}
.np-mark-all{font-size:12px;color:var(--purple);cursor:pointer;background:none;border:none;color:var(--purple);}
.np-list{max-height:360px;overflow-y:auto;}
.np-item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;
border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;position:relative;}
.np-item:hover{background:var(--s2);}
.np-item.unread{background:rgba(124,92,191,.04);}
.np-item.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--purple);}
.np-item:last-child{border-bottom:none;}
.np-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
justify-content:center;font-size:18px;flex-shrink:0;}
.np-body{flex:1;min-width:0;}
.np-item-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.np-item-msg{font-size:12px;color:var(--tm);line-height:1.5;}
.np-item-time{font-size:10.5px;color:var(--td);margin-top:3px;}
.np-empty{padding:30px;text-align:center;color:var(--tm);font-size:13px;}
.np-footer{padding:10px 16px;border-top:1px solid var(--border);text-align:center;}
.np-view-all{font-size:13px;color:var(--purple);cursor:pointer;background:none;border:none;color:var(--purple);font-weight:600;}

/* ── ORDER TRACKING ── */
.tracking-wrap{max-width:700px;}
.track-hero{background:linear-gradient(135deg,var(--purple),var(--purple-l));
border-radius:16px;padding:24px;color:#fff;margin-bottom:24px;}
.th-id{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:4px;}
.th-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.th-eta{font-size:13px;color:rgba(255,255,255,.8);}
.th-status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.2);
font-size:12px;font-weight:700;color:#fff;}
.track-timeline{background:var(--s1);border:1px solid var(--border);border-radius:16px;
padding:24px;margin-bottom:20px;box-shadow:var(--shadow);}
.tt-title{font-size:15px;font-weight:700;margin-bottom:20px;}
.tt-step{display:flex;gap:16px;position:relative;}
.tt-step:not(:last-child)::after{content:'';position:absolute;left:19px;top:40px;
width:2px;bottom:-8px;background:var(--border);}
.tt-step.done:not(:last-child)::after{background:var(--purple);}
.tt-step.active:not(:last-child)::after{background:linear-gradient(to bottom,var(--purple),var(--border));}
.tt-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:16px;flex-shrink:0;transition:.3s;border:2px solid var(--border);}
.tt-step.done .tt-dot{background:var(--purple);border-color:var(--purple);color:#fff;}
.tt-step.active .tt-dot{background:var(--s1);border-color:var(--purple);color:var(--purple);
box-shadow:0 0 0 4px rgba(124,92,191,.15);}
.tt-step.upcoming .tt-dot{background:var(--s2);color:var(--td);}
.tt-info{flex:1;padding-bottom:20px;}
.tt-label{font-size:14px;font-weight:700;margin-bottom:3px;}
.tt-step.upcoming .tt-label{color:var(--td);}
.tt-desc{font-size:12px;color:var(--tm);margin-bottom:3px;}
.tt-time{font-size:11px;color:var(--td);}
.tt-step.active .tt-time{color:var(--purple);font-weight:600;}
.track-details{background:var(--s1);border:1px solid var(--border);border-radius:12px;
padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.td-row{display:flex;justify-content:space-between;padding:9px 0;
border-bottom:1px solid var(--border);font-size:13px;}
.td-row:last-child{border-bottom:none;}
.td-lbl{color:var(--tm);}
.td-val{font-weight:600;text-align:right;}
.track-carrier{display:flex;align-items:center;gap:14px;background:var(--s2);
border-radius:12px;padding:14px 18px;border:1px solid var(--border);}
.tc-icon{font-size:32px;}
.tc-info{flex:1;}
.tc-name{font-size:13px;font-weight:700;}
.tc-num{font-size:12px;color:var(--tm);}
.tc-copy{padding:7px 14px;border-radius:8px;background:var(--s1);border:1px solid var(--border);
font-size:12px;cursor:pointer;font-weight:600;transition:.2s;}
.tc-copy:hover{background:var(--s3);}

/* FIX AI SIDEBAR CARD FOR LIGHT */
.ai-card-side{background:linear-gradient(135deg,#f0eaff,#e8dfff);border:1px solid rgba(124,92,191,.2);}
.ai-card-side:hover{border-color:rgba(124,92,191,.4);}
.ac-orb{background:radial-gradient(circle at 35% 35%,#9b7de0,#7c5cbf,#5a3db5);
box-shadow:0 4px 20px rgba(124,92,191,.3);}

/* FIX TOAST FOR LIGHT */
.toast{background:var(--s1);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow-lg);}
.toast-success{border-color:rgba(22,163,74,.3);background:#f0fdf4;}
.toast-error{border-color:rgba(220,38,38,.3);background:#fef2f2;}
.toast-info{border-color:rgba(124,92,191,.3);background:#faf5ff;}

/* FIX CHAT FOR LIGHT */
.chat-msg-ai{background:var(--s2);border:1px solid var(--border);color:var(--text);}
.chat-sug{background:var(--s2);border:1px solid var(--border);color:var(--text);}
.chat-sug:hover{background:rgba(124,92,191,.1);border-color:var(--purple);}

/* FIX SELLER DASHBOARD FOR LIGHT */
.seller-hero{background:linear-gradient(135deg,#f5f0ff,#faf8ff,#f8f5ff);border:1px solid var(--border);}
.sh-title{color:var(--text);}
.sh-sub{color:var(--tm);}
.sh-stat-val{color:var(--purple);}
.sh-badge{background:rgba(22,163,74,.08);border-color:rgba(22,163,74,.2);}
.ss-card{box-shadow:var(--shadow);}
.prod-table{background:var(--s1);}
.chart-card{box-shadow:var(--shadow);}
.top-products{box-shadow:var(--shadow);}
.bar{background:var(--purple);}

/* FIX SEARCH DROPDOWN FOR LIGHT */
.search-dropdown{background:var(--s1);border-color:var(--purple);box-shadow:var(--shadow-lg);}
.sd-row:hover,.sd-row.active-row{background:var(--s2);}
.sd-footer{background:var(--s1);}
.sd-kbd{background:var(--s2);}

/* ── WALLET SUB-PAGES ── */
.sub-page{max-width:540px;padding-bottom:24px;}
.sub-page-back{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tm);
cursor:pointer;background:none;border:none;color:var(--tm);margin-bottom:20px;padding:0;}
.sub-page-back:hover{color:var(--text);}
.sub-page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.sub-page-sub{font-size:13px;color:var(--tm);margin-bottom:24px;}

/* HELP & SUPPORT */
.help-search{display:flex;align-items:center;gap:10px;background:var(--s2);
border:1px solid var(--border);border-radius:12px;padding:11px 16px;margin-bottom:20px;}
.help-search input{background:none;border:none;outline:none;color:var(--text);
font-size:13px;flex:1;font-family:'DM Sans',sans-serif;}
.help-search input::placeholder{color:var(--td);}
.contact-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.contact-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;
padding:16px;text-align:center;cursor:pointer;transition:.2s;}
.contact-card:hover{border-color:var(--gold);transform:translateY(-2px);}
.cc-icon{font-size:28px;margin-bottom:8px;}
.cc-label{font-size:13px;font-weight:600;margin-bottom:3px;}
.cc-sub{font-size:11px;color:var(--tm);}
.faq-section{margin-bottom:16px;}
.faq-section-title{font-size:12px;font-weight:700;text-transform:uppercase;
letter-spacing:1.5px;color:var(--tm);margin-bottom:10px;padding:0 4px;}
.faq-item{background:var(--s1);border:1px solid var(--border);border-radius:10px;
margin-bottom:7px;overflow:hidden;cursor:pointer;transition:.2s;}
.faq-item:hover{border-color:rgba(255,255,255,.12);}
.faq-q{display:flex;align-items:center;justify-content:space-between;
padding:13px 16px;font-size:13px;font-weight:500;}
.faq-chevron{font-size:12px;color:var(--tm);transition:.2s;flex-shrink:0;}
.faq-chevron.open{transform:rotate(180deg);color:var(--gold);}
.faq-a{padding:0 16px 13px;font-size:12.5px;color:var(--tm);line-height:1.7;
border-top:1px solid var(--border);padding-top:12px;}
.support-form{background:var(--s1);border:1px solid var(--border);
border-radius:12px;padding:20px;margin-top:16px;}
.support-form-title{font-size:14px;font-weight:700;margin-bottom:16px;}

/* TERMS / PRIVACY */
.legal-meta{display:flex;align-items:center;justify-content:space-between;
padding:10px 14px;background:var(--s1);border:1px solid var(--border);
border-radius:10px;margin-bottom:20px;font-size:12px;color:var(--tm);}
.legal-body{background:var(--s1);border:1px solid var(--border);border-radius:12px;
overflow:hidden;}
.legal-section{padding:20px 22px;border-bottom:1px solid var(--border);}
.legal-section:last-child{border-bottom:none;}
.legal-h{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text);}
.legal-p{font-size:12.5px;color:var(--tm);line-height:1.85;margin-bottom:8px;}
.legal-p:last-child{margin-bottom:0;}
.legal-ul{list-style:none;padding:0;}
.legal-ul li{font-size:12.5px;color:var(--tm);line-height:1.7;padding-left:14px;
position:relative;}
.legal-ul li::before{content:'•';position:absolute;left:0;color:var(--gold);}
.legal-accept{display:flex;align-items:center;gap:12px;margin-top:20px;
padding:16px;background:var(--s1);border:1px solid var(--border);border-radius:12px;}
.legal-accept-text{flex:1;font-size:12px;color:var(--tm);}

/* EDIT PROFILE */
.avatar-upload{display:flex;flex-direction:column;align-items:center;gap:10px;
margin-bottom:24px;}
.avatar-large{width:86px;height:86px;border-radius:50%;
background:linear-gradient(135deg,#c45a0a,#ee7820);
display:flex;align-items:center;justify-content:center;font-size:34px;
font-weight:800;color:#fff;position:relative;}
.avatar-edit-btn{position:absolute;bottom:0;right:0;width:26px;height:26px;
border-radius:50%;background:var(--gold);display:flex;align-items:center;
justify-content:center;font-size:12px;cursor:pointer;border:2px solid var(--bg);}
.avatar-upload-lbl{font-size:12px;color:var(--purple-l);cursor:pointer;}

/* CHANGE PASSWORD */
.pw-strength{margin-top:6px;}
.pw-strength-bar{height:4px;border-radius:2px;margin-bottom:4px;transition:.3s;}
.pw-strength-label{font-size:11px;}

/* PASSWORD INPUT WRAPPER */
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:42px !important;}
.pass-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);
cursor:pointer;font-size:16px;color:var(--td);}

/* ADD MONEY PAGE */
.add-money-page{max-width:500px;margin:0 auto;}
.payment-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.pm-btn{padding:14px;border-radius:10px;background:var(--s2);
border:1px solid var(--border);text-align:center;cursor:pointer;transition:.2s;}
.pm-btn:hover{border-color:var(--gold);}
.pm-btn.sel{border-color:var(--gold);background:rgba(201,162,39,.08);}
.pm-icon{font-size:24px;margin-bottom:5px;}
.pm-label{font-size:11.5px;font-weight:600;}

/* REVIEWS */
.reviews-section{margin-top:28px;}
.review-item{background:var(--s1);border:1px solid var(--border);border-radius:10px;
padding:14px;margin-bottom:10px;}
.ri-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ri-name{font-size:13px;font-weight:600;}
.ri-date{font-size:11px;color:var(--tm);}
.ri-stars{color:var(--gold);font-size:12px;margin-bottom:6px;}
.ri-text{font-size:12.5px;color:var(--tm);line-height:1.6;}

.order-success{display:flex;flex-direction:column;align-items:center;
justify-content:center;min-height:400px;text-align:center;gap:14px;}

/* RESPONSIVE SCROLL */
.page-scroll{height:100%;overflow-y:auto;padding:0;}
/* ═══════════════════ ZERO TRUST SECURITY ═══════════════════ */

/* Trust badges */
.zt-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
  border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.zt-pill.secure{background:rgba(26,158,92,.1);color:#1a9e5c;border:1px solid rgba(26,158,92,.22);}
